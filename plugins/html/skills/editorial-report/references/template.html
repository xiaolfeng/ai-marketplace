<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title><!-- SLOT:title --></title>
    <script>
      // 首帧前确定主题：手动选择 > 页面声明的 data-theme > 系统深浅色，避免切换闪烁
      (function () {
        var root = document.documentElement;
        var saved = null;
        if (!root.hasAttribute("data-demo")) {
          try {
            saved = localStorage.getItem("html-report-theme");
          } catch (e) {}
        }
        if (saved === "light" || saved === "dark") {
          root.setAttribute("data-theme", saved);
        } else if (!root.hasAttribute("data-theme")) {
          var dark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          root.setAttribute("data-theme", dark ? "dark" : "light");
          root.setAttribute("data-theme-auto", "");
        }
      })();
    </script>
    <style>
      @layer theme, base, template, utilities;
      @layer template {
        :root,
        html[data-theme="light"] {
          --font-sans:
            -apple-system, BlinkMacSystemFont, "PingFang SC",
            "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", "Segoe UI",
            sans-serif;
          --font-serif: var(--font-sans);
          --font-mono:
            "SF Mono", "JetBrains Mono", ui-monospace, Menlo, Consolas,
            monospace;
          --page: 72.5rem;

          /* Typography & Spacing Scale · v2 统一阶梯 */
          --fs-xs: 12px;
          --fs-sm: 13px;
          --fs-md: 14px;
          --fs-base: 15px;
          --fs-body: 16px;
          --fs-lg: 18px;
          --s-1: 4px;
          --s-2: 8px;
          --s-3: 12px;
          --s-4: 16px;
          --s-5: 24px;
          --s-6: 32px;
          --s-7: 48px;

          /* Shape & Rhythm */
          --radius-xs: 6px;
          --radius-sm: 8px;
          --radius: 12px;
          --radius-md: 12px;
          --radius-lg: 14px;
          --pill: 999px;
          --radius-pill: 999px;
          --stripe: 2px;
          --ease-snappy: cubic-bezier(0.16, 1, 0.3, 1);

          /* Soft Light Surfaces & Text (WCAG AA >= 4.5:1) */
          --bg: #f6f7fb;
          --paper: #ffffff;
          --surface: var(--paper);
          --surface-2: #f8f9fc;
          --open-bg: var(--paper);
          --ink: #1f2937;
          --read-ink: #27303f;
          --muted: #525b6b;
          --read-muted: #525b6b;
          --subtle: #636b7c;
          --rule: #e6e9ef;
          --rule-strong: #dce0e8;
          --line: #e6e9ef;
          --line-soft: #eef1f6;
          --shadow: none;

          /* Default Accent · Teal */
          --accent: #0f766e;
          --accent-tint: #e8f5f3;
          --tone: var(--accent);

          /* Semantic Macaron Tokens (WCAG AA >= 4.8:1) */
          --ok: #24784d;
          --ok-tint: #edf7f1;
          --mark: #99580a;
          --mark-tint: #fdf5ea;
          --rose: #b83d56;
          --rose-tint: #fcf0f2;
          --color-success: var(--ok);
          --color-success-bg: var(--ok-tint);
          --color-success-border: #b8e0c8;
          --color-warn: var(--mark);
          --color-warn-bg: var(--mark-tint);
          --color-warn-border: #edd0a3;
          --color-danger: var(--rose);
          --color-danger-bg: var(--rose-tint);
          --color-danger-border: #eabcc5;
          --color-info: var(--accent);
          --color-info-bg: var(--accent-tint);
          --color-info-border: color-mix(
            in srgb,
            var(--accent) 28%,
            var(--line)
          );
        }

        html[data-accent="indigo"],
        html[data-theme="light"][data-accent="indigo"] {
          --accent: #4c5fd5;
          --accent-tint: #eef0fc;
        }

        html[data-accent="slate"],
        html[data-theme="light"][data-accent="slate"] {
          --accent: #3d5c80;
          --accent-tint: #edf1f6;
        }

        html[data-theme="dark"] {
          color-scheme: dark;
          --bg: #12141a;
          --paper: #181b22;
          --surface: var(--paper);
          --surface-2: #1c2028;
          --open-bg: #161920;
          --ink: #e6e8ec;
          --read-ink: #dfe2e8;
          --muted: #a3a9b5;
          --read-muted: #a3a9b5;
          --subtle: #9097a6;
          --rule: #262a33;
          --rule-strong: #323743;
          --line: #262a33;
          --line-soft: #1f232b;
          --shadow: none;

          --accent: #6fd1c4;
          --accent-tint: #15302d;
          --ok: #6fcf97;
          --ok-tint: #14261c;
          --mark: #e3b071;
          --mark-tint: #2a2318;
          --rose: #e58d9c;
          --rose-tint: #2a171c;

          --color-success: var(--ok);
          --color-success-bg: var(--ok-tint);
          --color-success-border: #24452f;
          --color-warn: var(--mark);
          --color-warn-bg: var(--mark-tint);
          --color-warn-border: #4d3a1a;
          --color-danger: var(--rose);
          --color-danger-bg: var(--rose-tint);
          --color-danger-border: #4d242d;
          --color-info: var(--accent);
          --color-info-bg: var(--accent-tint);
          --color-info-border: color-mix(
            in srgb,
            var(--accent) 32%,
            var(--line)
          );
        }

        html[data-theme="dark"][data-accent="indigo"] {
          --accent: #9aa8f5;
          --accent-tint: #1f2438;
        }

        html[data-theme="dark"][data-accent="slate"] {
          --accent: #9db4d1;
          --accent-tint: #1e2735;
        }

        @media (prefers-color-scheme: dark) {
          html:not([data-theme="light"]) {
            color-scheme: dark;
            --bg: #12141a;
            --paper: #181b22;
            --surface: var(--paper);
            --surface-2: #1c2028;
            --open-bg: #161920;
            --ink: #e6e8ec;
            --read-ink: #dfe2e8;
            --muted: #a3a9b5;
            --read-muted: #a3a9b5;
            --subtle: #9097a6;
            --rule: #262a33;
            --rule-strong: #323743;
            --line: #262a33;
            --line-soft: #1f232b;
            --shadow: none;

            --accent: #6fd1c4;
            --accent-tint: #15302d;
            --ok: #6fcf97;
            --ok-tint: #14261c;
            --mark: #e3b071;
            --mark-tint: #2a2318;
            --rose: #e58d9c;
            --rose-tint: #2a171c;

            --color-success: var(--ok);
            --color-success-bg: var(--ok-tint);
            --color-success-border: #24452f;
            --color-warn: var(--mark);
            --color-warn-bg: var(--mark-tint);
            --color-warn-border: #4d3a1a;
            --color-danger: var(--rose);
            --color-danger-bg: var(--rose-tint);
            --color-danger-border: #4d242d;
            --color-info: var(--accent);
            --color-info-bg: var(--accent-tint);
            --color-info-border: color-mix(
              in srgb,
              var(--accent) 32%,
              var(--line)
            );
          }
          html:not([data-theme="light"])[data-accent="indigo"] {
            --accent: #9aa8f5;
            --accent-tint: #1f2438;
          }
          html:not([data-theme="light"])[data-accent="slate"] {
            --accent: #9db4d1;
            --accent-tint: #1e2735;
          }
        }

        * {
          box-sizing: border-box;
        }
        html {
          color-scheme: light;
        }
        body {
          margin: 0;
          font-family: var(--font-sans);
          font-size: var(--fs-body);
          line-height: 1.8;
          letter-spacing: 0.01em;
          color: var(--read-ink);
          background:
            radial-gradient(
              1200px 520px at 15% -10%,
              color-mix(in srgb, var(--accent) 7%, transparent),
              transparent 70%
            ),
            var(--bg);
          background-attachment: fixed;
          font-synthesis: none;
          line-break: strict;
          overflow-wrap: break-word;
          text-wrap: pretty;
          text-rendering: optimizeLegibility;
          -webkit-font-smoothing: antialiased;
        }
        code {
          font-family: var(--font-mono);
          font-size: 0.86em;
          padding: 0.1em 0.38em;
          border-radius: 4px;
          background: color-mix(in srgb, var(--ink) 6%, transparent);
          color: inherit;
          word-break: break-word;
        }
        pre code {
          padding: 0;
          background: transparent;
          font-size: inherit;
          word-break: normal;
        }
        strong,
        b {
          font-weight: 650;
        }
        a {
          color: var(--accent);
          text-decoration-thickness: 1px;
          text-underline-offset: 3px;
        }
        a:hover {
          color: var(--mark);
        }
        ::selection {
          background: var(--accent-tint);
          color: var(--ink);
        }
        button {
          font: inherit;
          color: inherit;
          background: none;
          border: 0;
          padding: 0;
          cursor: pointer;
          -webkit-tap-highlight-color: transparent;
        }
        :is(
          a,
          button,
          summary,
          input,
          select,
          textarea,
          [tabindex]
        ):focus-visible {
          outline: 2px solid var(--accent);
          outline-offset: 2px;
          border-radius: 4px;
        }
        h1,
        h2,
        h3,
        h4,
        h5 {
          font-family: var(--font-sans);
          text-wrap: balance;
          text-align: left;
        }
        h1,
        h2,
        h3,
        p {
          margin-top: 0;
        }

        .page {
          width: min(var(--page), calc(100% - 48px));
          margin: 0 auto;
          padding: 0 0 72px;
        }

        .top {
          display: flex;
          justify-content: space-between;
          align-items: center;
          gap: 16px 24px;
          flex-wrap: wrap;
          padding: 24px 0 16px;
          border-bottom: 1px solid var(--line);
        }
        .brand {
          font-family: var(--font-mono);
          font-size: var(--fs-sm);
          font-weight: 700;
          letter-spacing: 0.12em;
          text-transform: uppercase;
          color: var(--ink);
          display: inline-flex;
          align-items: center;
          gap: 6px;
        }
        .top-right {
          display: flex;
          align-items: center;
          gap: 16px;
          flex-wrap: wrap;
        }
        .meta {
          font-family: var(--font-mono);
          font-size: var(--fs-sm);
          line-height: 1.4;
          color: var(--read-muted);
          text-align: right;
        }

        .theme {
          display: inline-flex;
          align-items: stretch;
          border: 1px solid var(--line);
          border-radius: var(--pill);
          background: var(--paper);
          overflow: hidden;
        }
        .theme button {
          min-height: 32px;
          padding: 5px 12px;
          font-family: var(--font-sans);
          font-size: var(--fs-xs);
          font-weight: 600;
          letter-spacing: 0.04em;
          color: var(--read-muted);
          transition:
            background-color 0.2s var(--ease-snappy),
            color 0.2s var(--ease-snappy);
        }
        .theme button + button {
          border-left: 1px solid var(--line);
        }
        .theme button:hover {
          color: var(--ink);
        }
        .theme button[aria-pressed="true"] {
          background: var(--ink);
          color: var(--paper);
        }

        .sheet {
          background: transparent;
          border: 0;
          box-shadow: none;
        }

        .hero {
          position: relative;
          border-top: 0;
          padding: var(--s-7) 0 var(--s-6);
        }
        .hero:has(.takeaway),
        .hero:has(.verdict) {
          display: grid;
          grid-template-columns: minmax(0, 1.35fr) minmax(260px, 0.65fr);
          gap: var(--s-5) var(--s-7);
          align-items: start;
        }
        .hero:has(.takeaway) .kicker,
        .hero:has(.takeaway) h1,
        .hero:has(.takeaway) .lede,
        .hero:has(.verdict) .kicker,
        .hero:has(.verdict) h1,
        .hero:has(.verdict) .lede {
          grid-column: 1;
        }
        .hero:has(.takeaway) .takeaway,
        .hero:has(.verdict) .verdict,
        .hero:has(.verdict) .takeaway {
          grid-column: 2;
          grid-row: 1 / span 4;
          margin: 0;
        }

        .kicker,
        .block-no,
        .eyebrow {
          margin: 0 0 var(--s-3);
          font-family: var(--font-mono);
          font-size: var(--fs-xs);
          font-weight: 600;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: var(--accent);
          line-height: 1.4;
        }
        .hero .kicker {
          margin-bottom: var(--s-4);
        }
        .block-no {
          display: inline-flex;
          align-items: center;
          gap: 0.45em;
          margin: 0;
          padding: 4px 12px;
          border: 0;
          border-radius: var(--pill);
          background: var(--accent-tint);
          color: var(--accent);
          letter-spacing: 0.06em;
        }

        h1,
        .hero h1 {
          width: min(100%, 20em);
          font-family: var(--font-sans);
          font-size: clamp(2rem, 1.3rem + 2.2vw, 3.1rem);
          line-height: 1.2;
          font-weight: 700;
          color: var(--ink);
          margin: 0 0 var(--s-5);
          letter-spacing: -0.02em;
          text-wrap: balance;
        }
        .title-copy {
          display: inline;
        }
        h2,
        .block-head h2,
        main section h2 {
          font-family: var(--font-sans);
          font-size: clamp(1.5rem, 1.2rem + 0.9vw, 2rem);
          line-height: 1.3;
          font-weight: 750;
          letter-spacing: -0.015em;
          margin: 0;
          color: var(--ink);
        }
        h3 {
          font-family: var(--font-sans);
          font-size: var(--fs-lg);
          font-weight: 700;
          line-height: 1.45;
          margin: 0 0 var(--s-3);
          color: var(--ink);
        }
        .lede,
        .block > p,
        .open > p {
          margin: 0 0 var(--s-3);
        }
        .lede {
          max-width: 46em;
          color: var(--read-muted);
          font-family: var(--font-sans);
          font-size: var(--fs-body);
          line-height: 1.85;
          margin: 0;
        }
        .section-intro {
          margin: var(--s-3) 0 0;
          max-width: 46em;
          color: var(--read-muted);
          font-size: var(--fs-base);
          line-height: 1.8;
        }
        .block-head {
          display: flex;
          flex-direction: column;
          align-items: flex-start;
          gap: var(--s-3);
          margin: 0;
          text-align: left;
        }
        .block-head > div {
          width: 100%;
          max-width: 46em;
        }

        /* Section Rhythm · 章节统一间距（Owl 选择器，无强制覆盖） */
        .block,
        main > section {
          margin: var(--s-7) 0 0;
          padding: var(--s-7) 0 0;
          border-top: 1px solid var(--line-soft);
          background: transparent;
        }
        main > section:first-of-type {
          margin-top: var(--s-6);
          padding-top: 0;
          border-top: 0;
        }
        main > section:not(.open) > * {
          margin-top: 0;
          margin-bottom: 0;
        }
        main > section:not(.open) > * + * {
          margin-top: var(--s-5);
        }
        main > section:not(.open) > .block-head + * {
          margin-top: var(--s-6);
        }
        main > section:not(.open) > * + h3 {
          margin-top: var(--s-7);
        }
        main > section:not(.open) > h3 + * {
          margin-top: var(--s-4);
        }
        main > section > p {
          font-size: var(--fs-body);
          line-height: 1.85;
          max-width: 46em;
        }
        main > section > h3 {
          display: flex;
          align-items: center;
          gap: 10px;
          margin-bottom: 0;
          padding: 0;
          border: 0;
          font-family: var(--font-sans);
          font-size: var(--fs-lg);
          font-weight: 700;
          line-height: 1.45;
          color: var(--ink);
        }
        main > section > h3::before {
          content: "";
          flex: 0 0 3px;
          height: 16px;
          border-radius: 2px;
          background: color-mix(in srgb, var(--accent) 55%, transparent);
        }

        /* MODULE 1: Glance as soft summary cards */
        .glance {
          counter-reset: koma;
          display: grid;
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: var(--s-4);
          margin: 0 0 var(--s-2);
          padding: 0;
          border: 0;
          background: transparent;
        }
        .glance-item {
          counter-increment: koma;
          position: relative;
          padding: var(--s-4) 20px;
          border: 1px solid var(--line);
          border-radius: var(--radius);
          background: color-mix(in srgb, var(--paper) 85%, transparent);
        }
        .glance-item::after {
          content: "#" counter(koma, decimal-leading-zero);
          position: absolute;
          top: 12px;
          right: 14px;
          padding: 3px 7px;
          font: 600 10.5px / 1 var(--font-mono);
          letter-spacing: 0.06em;
          color: var(--accent);
          background: var(--accent-tint);
          border-radius: var(--pill);
        }
        .glance-item > .kicker {
          font-size: var(--fs-xs);
          font-weight: 600;
          letter-spacing: 0.06em;
          margin: 0 0 6px;
          padding-right: 40px;
          color: var(--accent);
          text-transform: none;
        }
        .val {
          margin: 0 0 4px;
          font-family: var(--font-sans);
          font-size: var(--fs-body);
          font-weight: 700;
          line-height: 1.5;
          letter-spacing: -0.01em;
          color: var(--ink);
        }
        .note {
          margin: 0;
          font-size: var(--fs-sm);
          color: var(--read-muted);
          line-height: 1.65;
        }

        /* MODULE 2: KPI cards & Scope / Verdict Status Cards */
        .stat-grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(185px, 1fr));
          gap: 16px;
          margin: 16px 0 8px;
        }
        /* 4 张非大数字的范围/验收卡片默认排为对称 2x2 矩阵，避免出现第一行 3 张、第二行 1 张的孤儿行 */
        .stat-grid:has(> :nth-child(4):last-child):not(:has(.stat-val)) {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .stat-card {
          background: var(--paper);
          border: 1px solid var(--rule);
          padding: 20px 22px;
          display: flex;
          flex-direction: column;
          transition: border-color 0.2s ease;
        }
        .stat-card:hover {
          border-color: color-mix(in srgb, var(--accent) 40%, var(--rule));
        }
        :is(.stat-card, .compare-card, .takeaway-card).card-pass,
        :is(.stat-card, .compare-card, .takeaway-card).status-pass {
          border-top: 3px solid var(--color-success);
        }
        :is(.stat-card, .compare-card, .takeaway-card).card-warn,
        :is(.stat-card, .compare-card, .takeaway-card).status-warn {
          border-top: 3px solid var(--mark);
        }
        :is(.stat-card, .compare-card, .takeaway-card).card-fail,
        :is(.stat-card, .compare-card, .takeaway-card).status-fail {
          border-top: 3px solid var(--color-danger);
        }
        :is(.stat-card, .compare-card, .takeaway-card).card-info,
        :is(.stat-card, .compare-card, .takeaway-card).status-info {
          border-top: 3px solid var(--accent);
        }
        .stat-head,
        .card-head {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 10px;
          gap: 8px 12px;
          flex-wrap: wrap;
        }
        .stat-card:not(:has(.stat-val)) > :is(.stat-head, .card-head),
        :is(.compare-card, .takeaway-card) > :is(.stat-head, .card-head) {
          margin-bottom: 12px;
          padding-bottom: 10px;
          border-bottom: 1px solid
            color-mix(in srgb, var(--rule) 75%, transparent);
        }
        .stat-head > :first-child,
        .card-head > :first-child,
        .card-title-group {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          flex-wrap: wrap;
          min-width: 0;
        }
        .stat-head > :is(.badge, .label, .stat-delta):last-child,
        .card-head > :is(.badge, .label, .stat-delta):last-child {
          margin-left: auto;
          flex-shrink: 0;
        }
        :is(.stat-head, .card-head, .card-title-group)
          :is(
            .compare-tag,
            .compare-title,
            .t-num,
            .t-title,
            .card-title,
            .stat-label,
            strong,
            h3,
            h4
          ) {
          margin: 0;
        }
        .card-title,
        :is(.stat-head, .card-head) strong {
          font-family: var(--font-sans);
          font-size: 1.08rem;
          font-weight: 700;
          line-height: 1.35;
          color: var(--ink);
        }
        .stat-label {
          font-family: var(--font-mono);
          font-size: 12px;
          font-weight: 700;
          letter-spacing: 0.04em;
          color: var(--muted);
        }
        .stat-val {
          font-family: var(--font-sans);
          font-size: 2rem;
          font-weight: 700;
          line-height: 1.15;
          font-variant-numeric: tabular-nums;
          letter-spacing: -0.03em;
          margin: 0 0 6px;
        }
        .stat-footer {
          display: flex;
          align-items: center;
          gap: 8px;
          font-size: 12.5px;
          color: var(--muted);
        }
        .stat-desc,
        .card-desc,
        .stat-card:not(:has(.stat-val)) > p,
        .stat-card:not(:has(.stat-val)) > .stat-footer {
          font-size: 13.5px;
          line-height: 1.62;
          color: var(--muted);
          margin: 0;
        }
        .stat-delta {
          font-family: var(--font-mono);
          font-weight: 700;
          font-size: 11px;
          padding: 2px 7px;
          line-height: 1.4;
        }
        .delta-up {
          background: var(--color-success-bg);
          color: var(--color-success);
        }
        .delta-down {
          background: var(--color-danger-bg);
          color: var(--color-danger);
        }
        .delta-warn {
          background: var(--color-warn-bg);
          color: var(--color-warn);
        }
        .delta-neutral {
          background: var(--rule);
          color: var(--muted);
        }

        .progress-track,
        .meter {
          width: 100%;
          height: 12px;
          background: var(--paper);
          border: 1px solid var(--rule-strong);
          overflow: hidden;
          margin-top: 10px;
        }
        .progress-fill,
        .meter > span {
          display: block;
          height: 100%;
          background: var(--accent);
        }
        .progress-fill.success,
        .meter.success > span {
          background: var(--color-success);
        }
        .progress-fill.warn,
        .meter.warn > span {
          background: var(--mark);
        }

        .meter-row {
          display: grid;
          grid-template-columns: 190px 1fr 98px;
          gap: 16px;
          align-items: center;
          margin: 12px 0;
        }
        .meter-label {
          font-weight: 700;
        }
        .meter {
          margin-top: 0;
        }
        .meter-note {
          color: var(--muted);
          font-family: var(--font-mono);
          font-size: 12px;
          text-align: right;
        }

        /* MODULE 3: Comparison cards */
        .compare-grid {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 16px;
          margin: 16px 0;
        }
        .compare-card {
          background: var(--paper);
          border: 1px solid var(--rule);
          padding: 22px 22px 20px;
        }
        .compare-card.target,
        .compare-card.after {
          border-top: 3px solid var(--accent);
          background: color-mix(in srgb, var(--accent-tint) 45%, var(--paper));
        }
        .compare-tag {
          display: inline-flex;
          align-items: center;
          font-family: var(--font-mono);
          font-size: 11px;
          font-weight: 700;
          letter-spacing: 0.06em;
          text-transform: uppercase;
          padding: 2px 8px;
          min-height: 22px;
          line-height: 1.3;
          margin-bottom: 10px;
          vertical-align: middle;
          border: 1px solid currentColor;
          color: var(--muted);
        }
        .compare-tag:not(:only-child):has(
            + :is(strong, b, span, .badge, .label)
          ) {
          margin-bottom: 0;
          margin-right: 8px;
        }
        :is(.compare-title, .t-title, .stat-label, h3, h4):has(> .compare-tag) {
          display: flex;
          align-items: center;
          gap: 8px;
          flex-wrap: wrap;
        }
        :is(.compare-title, .t-title, .stat-label, h3, h4, p) > .compare-tag {
          margin: 0 8px 0 0;
        }
        :is(.compare-title, .t-title, .stat-label, h3, h4):has(> .compare-tag)
          > .compare-tag {
          margin: 0;
        }
        .compare-card.target .compare-tag,
        .compare-card.after .compare-tag {
          background: var(--accent);
          color: var(--paper);
          border-color: var(--accent);
        }
        .compare-title {
          font-family: var(--font-sans);
          font-size: 1.25rem;
          font-weight: 700;
          margin: 0 0 10px;
        }

        table.compare-table {
          width: 100%;
          border-collapse: collapse;
          font-size: var(--fs-md);
          line-height: 1.75;
          margin: 0;
        }

        /* MODULE 5: Status badges + editorial labels (Macaron soft pills) */
        .badge {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          min-height: 22px;
          padding: 2px 10px;
          border: 0;
          border-radius: var(--pill);
          font-family: var(--font-sans);
          font-size: var(--fs-xs);
          font-weight: 600;
          line-height: 1.4;
          letter-spacing: 0.01em;
          white-space: nowrap;
          vertical-align: middle;
        }
        .badge::before {
          content: "";
          flex: 0 0 5px;
          width: 5px;
          height: 5px;
          border-radius: 50%;
          background: currentColor;
          opacity: 0.72;
        }
        .badge-done {
          background: var(--color-success-bg);
          color: var(--color-success);
        }
        .badge-info,
        .badge-progress {
          background: var(--accent-tint);
          color: var(--accent);
        }
        .badge-warn {
          background: var(--color-warn-bg);
          color: var(--color-warn);
        }
        .badge-blocked {
          background: var(--color-danger-bg);
          color: var(--color-danger);
        }
        .badge-plan {
          background: var(--surface-2);
          color: var(--read-muted);
          box-shadow: inset 0 0 0 1px var(--line);
        }
        .label {
          display: inline-flex;
          align-items: center;
          min-height: 22px;
          padding: 2px 10px;
          border: 0;
          border-radius: var(--pill);
          font-family: var(--font-mono);
          font-size: var(--fs-xs);
          font-weight: 600;
          letter-spacing: 0.04em;
          line-height: 1.3;
          vertical-align: middle;
          white-space: nowrap;
        }
        .label.confirmed,
        .confirmed {
          color: var(--accent);
          background: var(--accent-tint);
        }
        .label.reported,
        .reported {
          color: var(--color-info);
          background: var(--color-info-bg);
        }
        .label.inferred,
        .inferred {
          color: var(--mark);
          background: var(--mark-tint);
        }
        .label.unknown,
        .unknown {
          color: var(--color-danger);
          background: var(--color-danger-bg);
        }
        .push-end {
          margin-left: auto;
        }
        .pill-row {
          display: flex;
          flex-wrap: wrap;
          gap: var(--s-2);
        }
        .footnote {
          font-size: var(--fs-sm);
          line-height: 1.7;
          color: var(--read-muted);
        }

        /* MODULE 6: Callout — soft tinted card + thin left accent stripe */
        .callout {
          --tone: var(--accent);
          display: block;
          padding: 20px var(--s-5);
          margin: 0;
          border: 1px solid color-mix(in srgb, var(--tone) 14%, var(--line));
          border-radius: var(--radius);
          background: var(--surface);
          box-shadow: inset var(--stripe) 0 0
            color-mix(in srgb, var(--tone) 70%, transparent);
          font-size: var(--fs-base);
          line-height: 1.8;
        }
        .callout-title {
          font-family: var(--font-sans);
          font-size: var(--fs-base);
          font-weight: 700;
          letter-spacing: 0;
          margin: 0 0 var(--s-2);
          color: var(--tone);
        }
        .callout p,
        .callout li {
          font-size: var(--fs-base);
          line-height: 1.8;
        }
        .callout p {
          margin: 0;
        }
        .callout p + p,
        .callout p + ul,
        .callout ul + p {
          margin-top: var(--s-2);
        }
        .callout-info {
          --tone: var(--accent);
          background: color-mix(in srgb, var(--accent) 3%, var(--paper));
        }
        .callout-warn {
          --tone: var(--mark);
          background: color-mix(in srgb, var(--mark) 4%, var(--paper));
        }
        .callout-danger {
          --tone: var(--color-danger);
          background: color-mix(in srgb, var(--color-danger) 4%, var(--paper));
        }
        .callout-success {
          --tone: var(--color-success);
          background: color-mix(in srgb, var(--color-success) 4%, var(--paper));
        }
        .split-note,
        .callout.split-note,
        .editor-split {
          display: grid;
          grid-template-columns: 1fr 1fr;
          padding: 0;
          gap: 0;
          border: 1px solid var(--line);
          border-radius: var(--radius);
          background: var(--surface);
          box-shadow: none;
          overflow: hidden;
        }
        .split-note > div,
        .callout.split-note > div,
        .editor-split > div {
          padding: 20px var(--s-5);
        }
        .split-note > div + div,
        .callout.split-note > div + div,
        .editor-split > div + div {
          border-left: 1px solid var(--line);
        }
        .split-note h3 {
          margin: var(--s-3) 0 var(--s-2);
          padding: 0;
          border: 0;
          font-size: var(--fs-body);
          font-weight: 700;
        }
        .split-note h3::before {
          display: none;
        }

        /* MODULE 7: Timeline */
        .timeline {
          position: relative;
          padding-left: 132px;
          margin: 22px 0;
        }
        .timeline::before {
          content: "";
          position: absolute;
          left: 110px;
          top: 8px;
          bottom: 8px;
          width: 1px;
          background: var(--rule-strong);
        }
        .timeline-item {
          --timeline-head-height: 32px;
          position: relative;
          margin-bottom: 26px;
        }
        .timeline-item:last-child {
          margin-bottom: 0;
        }
        .timeline-dot {
          position: absolute;
          left: -28px;
          top: calc(var(--timeline-head-height) / 2);
          width: 11px;
          height: 11px;
          border-radius: 50%;
          background: var(--bg);
          border: 2px solid var(--accent);
          transform: translateY(-50%);
          transform-origin: center;
        }
        .timeline-dot.done {
          border-color: var(--color-success);
          background: var(--color-success);
        }
        .timeline-dot.current {
          border-color: var(--mark);
          box-shadow: 0 0 0 3px var(--mark-tint);
        }
        .timeline-header {
          display: flex;
          align-items: center;
          min-height: var(--timeline-head-height);
          gap: 10px;
          margin-bottom: 4px;
          flex-wrap: wrap;
        }
        .timeline-date {
          position: absolute;
          left: -132px;
          width: 98px;
          top: calc(var(--timeline-head-height) / 2);
          transform: translateY(-50%);
          font-family: var(--font-mono);
          font-size: 12px;
          line-height: 1.3;
          color: var(--muted);
          font-weight: 700;
          text-align: right;
        }
        .timeline-title {
          font-family: var(--font-sans);
          font-size: 1.15rem;
          line-height: 1.35;
          font-weight: 700;
        }
        .timeline-body {
          font-size: 14.5px;
          color: var(--muted);
          margin: 0;
        }

        /* MODULE 8: Verdict / takeaway — soft accent-tinted card (no dark inversion) */
        .takeaway,
        .verdict,
        .system-map {
          --ink-well: color-mix(in srgb, var(--accent) 5%, var(--paper));
          --on-ink: var(--ink);
          background: var(--ink-well);
          color: var(--ink);
          border: 1px solid color-mix(in srgb, var(--accent) 16%, var(--line));
          border-radius: var(--radius);
          padding: var(--s-5);
          margin: 0;
          box-shadow: none;
        }
        .takeaway-title,
        .verdict .kicker,
        .system-map .kicker {
          font-family: var(--font-mono);
          font-size: var(--fs-xs);
          font-weight: 600;
          letter-spacing: 0.1em;
          text-transform: uppercase;
          color: var(--accent);
          margin: 0 0 var(--s-3);
        }
        .takeaway p,
        .verdict p {
          font-family: var(--font-sans);
          font-size: var(--fs-base);
          font-weight: 500;
          line-height: 1.8;
          margin: 0;
          color: var(--read-ink);
        }
        .takeaway p strong,
        .verdict p strong {
          font-weight: 700;
          color: var(--ink);
        }

        /* MODULE 9: Hero Variants (Banner Hero & Metric Hero) */
        .hero.hero-banner {
          display: grid;
          grid-template-columns: minmax(0, 1.25fr) minmax(280px, 0.75fr);
          gap: 36px 48px;
          align-items: center;
        }
        .hero-tags {
          display: flex;
          gap: 8px;
          align-items: center;
          margin-bottom: 12px;
          flex-wrap: wrap;
        }
        .hero-figure-box {
          border: 1px solid var(--rule-strong);
          background: var(--paper);
          padding: 18px;
          position: relative;
        }
        .hero-figure-placeholder {
          background: color-mix(in srgb, var(--accent-tint) 50%, var(--paper));
          border: 1px dashed var(--rule-strong);
          padding: 32px 20px;
          text-align: center;
        }
        .hero-figure-tag {
          font-family: var(--font-mono);
          font-size: 10px;
          font-weight: 700;
          letter-spacing: 0.12em;
          color: var(--accent);
          display: block;
          margin-bottom: 6px;
        }
        .hero-figure-title {
          font-family: var(--font-sans);
          font-size: 1.1rem;
          font-weight: 700;
          color: var(--ink);
        }

        .hero.hero-metric {
          display: grid;
          grid-template-columns: minmax(0, 1.3fr) minmax(240px, 0.7fr);
          gap: 36px 48px;
          align-items: end;
        }
        .hero-metric-focal {
          background: color-mix(in srgb, var(--accent) 6%, var(--paper));
          color: var(--ink);
          border: 1px solid color-mix(in srgb, var(--accent) 20%, var(--line));
          border-radius: var(--radius);
          padding: 24px 26px;
        }
        .focal-kicker {
          font-family: var(--font-mono);
          font-size: 11px;
          font-weight: 700;
          letter-spacing: 0.12em;
          color: var(--accent);
          margin-bottom: 8px;
        }
        .focal-num {
          font-family: var(--font-sans);
          font-size: clamp(2.4rem, 1.5rem + 2.5vw, 3.6rem);
          font-weight: 750;
          line-height: 1;
          letter-spacing: -0.03em;
          color: var(--ink);
          margin-bottom: 6px;
          font-variant-numeric: tabular-nums;
        }
        .focal-label {
          font-size: var(--fs-sm);
          color: var(--read-muted);
          line-height: 1.5;
          margin-bottom: 10px;
        }
        .focal-delta {
          display: inline-block;
          font-family: var(--font-mono);
          font-size: 11px;
          font-weight: 700;
          padding: 2px 7px;
        }

        /* MODULE 10: Charts System (SVG Bar, Line, Donut) */
        .chart-box {
          background: var(--paper);
          border: 1px solid var(--rule);
          padding: 20px 22px;
          margin: 18px 0;
        }
        .chart-head {
          display: flex;
          justify-content: space-between;
          align-items: baseline;
          gap: 12px;
          flex-wrap: wrap;
          margin-bottom: 16px;
        }
        .chart-title {
          font-family: var(--font-sans);
          font-size: 1.15rem;
          font-weight: 700;
        }
        .chart-sub {
          font-family: var(--font-mono);
          font-size: 12px;
          color: var(--muted);
          margin-top: 2px;
        }
        .chart-legend {
          display: flex;
          gap: 14px;
          font-family: var(--font-mono);
          font-size: 12px;
          color: var(--muted);
          flex-wrap: wrap;
        }
        .legend-item {
          display: inline-flex;
          align-items: center;
          gap: 6px;
        }
        .legend-dot {
          width: 8px;
          height: 8px;
          border-radius: 50%;
          display: inline-block;
          flex-shrink: 0;
        }
        .chart-svg-wrap {
          width: 100%;
          overflow-x: auto;
        }
        .chart-svg {
          width: 100%;
          height: auto;
          display: block;
          min-width: 480px;
        }
        .chart-label {
          font-family: var(--font-mono);
          font-size: 11px;
          fill: var(--muted);
        }
        .chart-val {
          font-family: var(--font-mono);
          font-size: 11px;
          font-weight: 700;
          fill: var(--ink);
        }
        .chart-delta {
          font-family: var(--font-mono);
          font-size: 12px;
          font-weight: 700;
          padding: 2px 8px;
          border: 1px solid currentColor;
        }

        /* Donut Chart */
        .donut-wrap {
          display: grid;
          grid-template-columns: 180px minmax(0, 1fr);
          gap: 28px 36px;
          align-items: center;
          margin-top: 10px;
        }
        .donut-svg-container {
          position: relative;
          width: 160px;
          height: 160px;
          margin: 0 auto;
        }
        .donut-svg {
          width: 100%;
          height: 100%;
          transform: rotate(-90deg);
        }
        .donut-center {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
          pointer-events: none;
        }
        .donut-center-num {
          font-family: var(--font-sans);
          font-size: 1.4rem;
          font-weight: 700;
          line-height: 1;
        }
        .donut-center-label {
          font-family: var(--font-mono);
          font-size: 10px;
          font-weight: 700;
          color: var(--muted);
          letter-spacing: 0.1em;
          margin-top: 2px;
        }
        .donut-legend-list {
          display: flex;
          flex-direction: column;
          gap: 8px;
        }
        .donut-legend-row {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 12px;
          padding: 8px 10px;
          background: color-mix(in srgb, var(--bg) 50%, var(--paper));
          border: 1px solid var(--rule);
          font-size: 13.5px;
        }
        .donut-legend-name {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          color: var(--ink);
        }
        .donut-legend-val {
          font-family: var(--font-mono);
          font-size: 13px;
          color: var(--ink);
        }

        /* MODULE 11: Pele Diagram Container（Mermaid 语法 · Pele 渲染） */
        :root {
          /* Pele 主题：全部引用模板 token，深浅切换即时生效，无需重新渲染 */
          --pele-bg: var(--paper);
          --pele-fg: var(--ink);
          --pele-muted: var(--muted);
          --pele-line: var(--rule-strong);
          --pele-border: var(--rule-strong);
          --pele-surface: var(--accent-tint);
          --pele-surface-alt: var(--mark-tint);
          --pele-accent: var(--accent);
          --pele-critical: var(--rose);
          --pele-error: var(--color-danger);
          --pele-font: var(--font-sans);
          --pele-font-mono: var(--font-mono);
          --pele-radius: var(--radius-sm);
        }
        .pele-box {
          background: var(--paper);
          border: 1px solid var(--rule);
          border-top: 3px solid var(--accent);
          margin: 18px 0;
          padding: 18px 20px;
        }
        .pele-head {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 14px;
          padding-bottom: 8px;
          border-bottom: 1px solid var(--rule);
        }
        .pele-tag {
          font-family: var(--font-mono);
          font-size: 11px;
          font-weight: 700;
          letter-spacing: 0.1em;
          color: var(--accent);
        }
        .pele-meta {
          font-family: var(--font-mono);
          font-size: 11px;
          color: var(--muted);
        }
        .pele-view {
          overflow-x: auto;
          padding: 12px 0;
          text-align: center;
        }
        .pele-view pre.pele {
          background: transparent;
          margin: 0;
          font-family: var(--font-mono);
          font-size: 13px;
          color: var(--ink);
          white-space: pre;
        }
        .pele-source {
          margin-top: 10px;
          border-top: 1px dashed var(--rule);
          padding-top: 8px;
          font-family: var(--font-mono);
          font-size: 12px;
        }
        .pele-source summary {
          cursor: pointer;
          color: var(--muted);
          font-weight: 600;
        }
        .pele-source pre {
          background: color-mix(in srgb, var(--bg) 70%, var(--paper));
          padding: 10px 12px;
          margin: 8px 0 0;
          overflow-x: auto;
        }

        /* MODULE 12: Diff View */
        .diff-box {
          background: var(--paper);
          border: 1px solid var(--rule);
          margin: 18px 0;
          font-family: var(--font-mono);
          font-size: 13px;
        }
        .diff-head {
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding: 10px 14px;
          background: color-mix(in srgb, var(--bg) 60%, var(--paper));
          border-bottom: 1px solid var(--rule);
          font-weight: 700;
          font-size: 12px;
        }
        .diff-stats {
          display: flex;
          gap: 8px;
        }
        .diff-add {
          color: var(--color-success);
        }
        .diff-del {
          color: var(--color-danger);
        }
        .diff-body {
          overflow-x: auto;
          line-height: 1.5;
        }
        .diff-line {
          display: flex;
          padding: 2px 8px;
          white-space: pre;
        }
        .diff-line .ln {
          width: 3.5em;
          color: var(--subtle);
          user-select: none;
          flex-shrink: 0;
        }
        .diff-line .sign {
          width: 1.5em;
          user-select: none;
          font-weight: 700;
          flex-shrink: 0;
        }
        .diff-line .code {
          flex-grow: 1;
        }
        .diff-line.add {
          background: color-mix(
            in srgb,
            var(--color-success-bg) 80%,
            transparent
          );
          color: var(--color-success);
        }
        .diff-line.del {
          background: color-mix(
            in srgb,
            var(--color-danger-bg) 80%,
            transparent
          );
          color: var(--color-danger);
        }
        .diff-line.ctx {
          color: var(--ink);
        }

        /* MODULE 13: Evaluation Scorecard */
        .scorecard-box {
          background: var(--paper);
          border: 1px solid var(--rule);
          border-top: 3px solid var(--mark);
          padding: 22px 24px;
          margin: 18px 0;
        }
        .scorecard-head {
          display: flex;
          justify-content: space-between;
          align-items: center;
          gap: 16px;
          margin-bottom: 18px;
          padding-bottom: 14px;
          border-bottom: 1px solid var(--rule);
          flex-wrap: wrap;
        }
        .scorecard-title {
          font-family: var(--font-sans);
          font-size: 1.25rem;
          font-weight: 700;
        }
        .scorecard-sub {
          font-family: var(--font-mono);
          font-size: 12px;
          color: var(--muted);
          margin-top: 2px;
        }
        .scorecard-total {
          display: flex;
          align-items: baseline;
          gap: 8px;
        }
        .scorecard-total-num {
          font-family: var(--font-sans);
          font-size: 2.2rem;
          font-weight: 700;
          color: var(--ink);
        }
        .scorecard-list {
          display: flex;
          flex-direction: column;
          gap: 12px;
        }
        .scorecard-row {
          display: grid;
          grid-template-columns: minmax(0, 1.4fr) minmax(180px, 0.6fr);
          gap: 12px 20px;
          align-items: center;
          padding: 8px 0;
          border-bottom: 1px solid
            color-mix(in srgb, var(--rule) 50%, transparent);
        }
        .scorecard-row:last-child {
          border-bottom: 0;
        }
        .scorecard-dim strong {
          display: block;
          font-size: 14.5px;
          margin-bottom: 2px;
        }
        .scorecard-dim span {
          font-size: 12.5px;
          color: var(--muted);
        }
        .scorecard-bar-wrap {
          display: flex;
          align-items: center;
          gap: 10px;
        }
        .scorecard-bar {
          flex-grow: 1;
          height: 10px;
          background: var(--bg);
          border: 1px solid var(--rule-strong);
          position: relative;
        }
        .scorecard-bar > span {
          display: block;
          height: 100%;
          background: var(--accent);
        }
        .scorecard-bar.warn > span {
          background: var(--mark);
        }
        .scorecard-score {
          font-family: var(--font-mono);
          font-size: 13px;
          font-weight: 700;
          min-width: 2.5em;
          text-align: right;
        }

        /* MODULE 14: 2x2 Decision / Risk Matrix */
        .matrix-box {
          background: var(--paper);
          border: 1px solid var(--rule);
          padding: 20px 22px;
          margin: 18px 0;
        }
        .matrix-head {
          margin-bottom: 16px;
        }
        .matrix-title {
          font-family: var(--font-sans);
          font-size: 1.15rem;
          font-weight: 700;
        }
        .matrix-sub {
          font-family: var(--font-mono);
          font-size: 12px;
          color: var(--muted);
          margin-top: 2px;
        }
        .quadrant-grid {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 10px;
        }
        .quadrant {
          padding: 16px 18px;
          border: 1px solid var(--rule-strong);
          background: color-mix(in srgb, var(--bg) 40%, var(--paper));
          min-height: 130px;
        }
        .q-high-high {
          border-top: 3px solid var(--rose);
        }
        .q-high-low {
          border-top: 3px solid var(--color-success);
          background: color-mix(
            in srgb,
            var(--color-success-bg) 40%,
            var(--paper)
          );
        }
        .q-low-high {
          border-top: 3px solid var(--muted);
          opacity: 0.85;
        }
        .q-low-low {
          border-top: 3px solid var(--mark);
        }
        .quadrant-label {
          font-family: var(--font-mono);
          font-size: 11px;
          font-weight: 700;
          letter-spacing: 0.05em;
          margin-bottom: 10px;
          color: var(--ink);
        }
        .quadrant-items {
          margin: 0;
          padding: 0;
          list-style: none;
          display: flex;
          flex-direction: column;
          gap: 6px;
        }
        .quadrant-items li {
          display: flex;
          justify-content: space-between;
          align-items: center;
          gap: 8px;
          font-size: 13.5px;
          padding: 4px 0;
          border-bottom: 1px solid
            color-mix(in srgb, var(--rule) 60%, transparent);
        }
        .quadrant-items li:last-child {
          border-bottom: 0;
        }

        /* MODULE 15: Media & Gallery Grid */
        .gallery-wrap {
          margin: 18px 0;
        }
        .gallery-grid {
          display: grid;
          gap: 16px;
        }
        .gallery-grid.col-2 {
          grid-template-columns: 1fr 1fr;
        }
        .gallery-grid.col-3 {
          grid-template-columns: repeat(3, 1fr);
        }
        .gallery-item {
          margin: 0;
          border: 1px solid var(--rule);
          background: var(--paper);
        }
        .gallery-frame {
          border-bottom: 1px solid var(--rule);
          padding: 12px;
          background: color-mix(in srgb, var(--bg) 60%, var(--paper));
        }
        .gallery-placeholder {
          border: 1px dashed var(--rule-strong);
          padding: 36px 16px;
          text-align: center;
          background: var(--paper);
        }
        .gallery-placeholder-icon {
          font-family: var(--font-mono);
          font-size: 11px;
          font-weight: 700;
          color: var(--accent);
          letter-spacing: 0.1em;
          display: block;
          margin-bottom: 6px;
        }
        .gallery-placeholder p {
          margin: 0;
          font-size: 13.5px;
          color: var(--muted);
        }
        .gallery-caption {
          padding: 12px 14px;
          font-size: 13px;
          line-height: 1.45;
        }
        .gallery-caption strong {
          display: block;
          font-size: 13.5px;
          margin-bottom: 3px;
        }
        .gallery-caption span {
          color: var(--muted);
        }

        /* MODULE 16: Personnel & Stakeholders Grid */
        .personnel-grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
          gap: 14px;
          margin: 18px 0;
        }
        .personnel-card {
          background: var(--paper);
          border: 1px solid var(--rule);
          padding: 18px 20px;
        }
        .personnel-head {
          display: flex;
          align-items: center;
          gap: 12px;
          margin-bottom: 10px;
        }
        .personnel-avatar {
          width: 36px;
          height: 36px;
          background: var(--accent-tint);
          color: var(--accent);
          font-family: var(--font-sans);
          font-size: 16px;
          font-weight: 700;
          display: flex;
          align-items: center;
          justify-content: center;
          border: 1px solid var(--accent);
          flex-shrink: 0;
        }
        .personnel-name {
          font-weight: 700;
          font-size: 15px;
          line-height: 1.2;
        }
        .personnel-dept {
          font-family: var(--font-mono);
          font-size: 11px;
          color: var(--muted);
          margin-top: 2px;
        }
        .personnel-role {
          margin-bottom: 8px;
        }
        .personnel-desc {
          font-size: 13px;
          color: var(--muted);
          line-height: 1.5;
          margin: 0;
        }

        /* MODULE 17: File Tree & Hierarchy */
        .file-tree-box {
          background: var(--paper);
          border: 1px solid var(--rule);
          margin: 18px 0;
          font-family: var(--font-mono);
          font-size: 13px;
        }
        .file-tree-head {
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding: 10px 14px;
          background: color-mix(in srgb, var(--bg) 60%, var(--paper));
          border-bottom: 1px solid var(--rule);
          font-weight: 700;
          font-size: 12px;
        }
        .file-tree-title {
          color: var(--ink);
        }
        .file-tree-meta {
          color: var(--muted);
          font-size: 11px;
        }
        .file-tree-body {
          padding: 14px 16px;
          margin: 0;
          overflow-x: auto;
          line-height: 1.55;
        }
        .tree-comment {
          color: var(--muted);
          font-style: italic;
        }

        /* MODULE 19: Additional Advanced Visual & Report Components */

        /* Minimalist Masthead Hero */
        .hero.hero-minimal {
          display: block;
          padding-top: 36px;
        }
        .minimal-rule-top {
          height: 4px;
          background: var(--ink);
        }
        .minimal-rule-bottom {
          height: 1px;
          background: var(--rule-strong);
          margin-bottom: 24px;
        }
        .minimal-meta-strip {
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding: 8px 0;
          font-family: var(--font-mono);
          font-size: 11.5px;
          color: var(--muted);
          flex-wrap: wrap;
          gap: 12px;
        }
        .minimal-pub {
          font-weight: 700;
          color: var(--ink);
        }
        .minimal-authors {
          display: flex;
          gap: 18px;
          font-family: var(--font-mono);
          font-size: 12.5px;
          color: var(--muted);
          margin-top: 14px;
          flex-wrap: wrap;
        }

        /* Split Lead Hero */
        .hero.hero-split-lead {
          display: grid;
          grid-template-columns: minmax(0, 1.2fr) minmax(320px, 0.8fr);
          gap: 36px 48px;
          align-items: center;
        }
        .split-lead-byline {
          display: flex;
          gap: 14px;
          font-family: var(--font-mono);
          font-size: 12px;
          color: var(--muted);
          margin-top: 14px;
        }
        .split-lead-box {
          background: var(--paper);
          border: 1px solid var(--rule-strong);
          border-top: 3px solid var(--accent);
          padding: 24px 26px;
        }
        .split-lead-tag {
          font-family: var(--font-mono);
          font-size: 11px;
          font-weight: 700;
          color: var(--accent);
          letter-spacing: 0.1em;
          margin-bottom: 10px;
        }
        .split-lead-text {
          font-family: var(--font-sans);
          font-size: 1.25rem;
          font-weight: 700;
          line-height: 1.5;
          margin: 0 0 16px;
        }
        .split-lead-footer {
          display: flex;
          gap: 8px;
          flex-wrap: wrap;
        }

        /* Gauge / SLO Dial Chart */
        .gauge-wrap {
          display: grid;
          grid-template-columns: 220px minmax(0, 1fr);
          gap: 24px 36px;
          align-items: center;
          margin-top: 12px;
        }
        .gauge-svg-container {
          position: relative;
          width: 200px;
          height: 120px;
          margin: 0 auto;
        }
        .gauge-svg {
          width: 100%;
          height: 100%;
        }
        .gauge-readout {
          position: absolute;
          bottom: 4px;
          left: 0;
          right: 0;
          text-align: center;
          display: flex;
          flex-direction: column;
          align-items: center;
        }
        .gauge-num {
          font-family: var(--font-sans);
          font-size: 1.5rem;
          font-weight: 700;
          line-height: 1;
        }
        .gauge-label {
          font-family: var(--font-mono);
          font-size: 10px;
          font-weight: 700;
          color: var(--muted);
          letter-spacing: 0.1em;
          margin-top: 2px;
        }
        .gauge-details {
          display: flex;
          flex-direction: column;
          gap: 8px;
        }
        .gauge-stat-row {
          display: flex;
          justify-content: space-between;
          align-items: center;
          gap: 12px;
          padding: 8px 12px;
          background: color-mix(in srgb, var(--bg) 50%, var(--paper));
          border: 1px solid var(--rule);
          font-size: 13.5px;
        }

        /* Heatmap Grid */
        .heatmap-wrap {
          margin-top: 14px;
          overflow-x: auto;
        }
        .heatmap-grid {
          display: flex;
          flex-direction: column;
          gap: 4px;
          min-width: 540px;
        }
        .heatmap-row {
          display: flex;
          align-items: center;
          gap: 8px;
        }
        .heatmap-day {
          font-family: var(--font-mono);
          font-size: 11px;
          width: 3.5em;
          color: var(--muted);
        }
        .heatmap-cells {
          display: grid;
          grid-template-columns: repeat(24, 1fr);
          gap: 3px;
          flex-grow: 1;
        }
        .hm-c {
          height: 16px;
          background: color-mix(in srgb, var(--bg) 80%, var(--paper));
          border: 1px solid var(--rule);
        }
        .hm-c.l0 {
          background: var(--paper);
        }
        .hm-c.l1 {
          background: var(--accent-tint);
        }
        .hm-c.l2 {
          background: color-mix(in srgb, var(--accent) 40%, var(--accent-tint));
        }
        .hm-c.l3 {
          background: color-mix(in srgb, var(--accent) 70%, transparent);
        }
        .hm-c.l4 {
          background: var(--accent);
        }
        .hm-c.l5 {
          background: var(--mark);
        }
        .heatmap-hours {
          display: flex;
          justify-content: space-between;
          margin-left: 4em;
          margin-top: 6px;
          font-family: var(--font-mono);
          font-size: 10px;
          color: var(--muted);
        }

        /* Sparkline Table */
        .sparkline-table .spark-cell {
          width: 120px;
          padding: 6px 12px;
        }
        .sparkline-svg {
          width: 100px;
          height: 24px;
          display: block;
        }

        /* Counter Tape */
        .stat-tape-wrap {
          overflow-x: auto;
          margin: 18px 0;
          border: 1px solid var(--rule);
          background: var(--paper);
        }
        .stat-tape {
          display: flex;
          min-width: 680px;
        }
        .stat-tape-item {
          flex: 1;
          padding: 14px 18px;
          border-right: 1px solid var(--rule);
          display: flex;
          flex-direction: column;
          gap: 4px;
        }
        .stat-tape-item:last-child {
          border-right: 0;
        }
        .tape-label {
          font-family: var(--font-mono);
          font-size: 10.5px;
          font-weight: 700;
          color: var(--muted);
          letter-spacing: 0.05em;
        }
        .tape-val {
          font-family: var(--font-sans);
          font-size: 1.45rem;
          font-weight: 700;
        }
        .tape-delta {
          font-family: var(--font-mono);
          font-size: 11px;
          font-weight: 700;
          width: fit-content;
          padding: 1px 5px;
        }

        /* Layered Architecture Stack */
        .arch-stack-box {
          background: var(--paper);
          border: 1px solid var(--rule);
          padding: 20px 22px;
          margin: 18px 0;
        }
        .arch-stack-head {
          display: flex;
          justify-content: space-between;
          margin-bottom: 16px;
          font-family: var(--font-mono);
          font-size: 12px;
          font-weight: 700;
        }
        .arch-layers {
          display: flex;
          flex-direction: column;
          gap: 10px;
        }
        .arch-layer {
          border: 1px solid var(--rule-strong);
          background: color-mix(in srgb, var(--bg) 40%, var(--paper));
          padding: 14px 16px;
        }
        .arch-layer.highlight-layer {
          border-color: var(--accent);
          background: color-mix(in srgb, var(--accent-tint) 40%, var(--paper));
        }
        .layer-badge {
          font-family: var(--font-mono);
          font-size: 11px;
          font-weight: 700;
          color: var(--ink);
          margin-bottom: 10px;
        }
        .layer-nodes {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
          gap: 10px;
        }
        .layer-node {
          background: var(--paper);
          border: 1px solid var(--rule);
          padding: 10px 12px;
          display: flex;
          flex-direction: column;
          gap: 2px;
        }
        .layer-node.accent {
          border-top: 3px solid var(--mark);
        }
        .layer-node span {
          font-weight: 700;
          font-size: 13.5px;
        }
        .layer-node small {
          font-size: 11px;
          color: var(--muted);
        }
        .layer-connector {
          text-align: center;
          font-family: var(--font-mono);
          font-size: 11px;
          color: var(--muted);
          letter-spacing: 0.1em;
        }

        /* Sequence Lane Flow */
        .seq-box {
          background: var(--paper);
          border: 1px solid var(--rule);
          border-top: 3px solid var(--accent);
          padding: 18px 20px;
          margin: 18px 0;
        }
        .seq-head {
          display: flex;
          justify-content: space-between;
          margin-bottom: 16px;
          font-family: var(--font-mono);
          font-size: 12px;
          font-weight: 700;
        }
        .seq-actors {
          display: grid;
          grid-template-columns: repeat(4, 1fr);
          gap: 8px;
          text-align: center;
          margin-bottom: 16px;
        }
        .actor {
          background: var(--accent-tint);
          color: var(--accent);
          border: 1px solid color-mix(in srgb, var(--accent) 24%, var(--line));
          text-align: center;
          padding: 8px;
          font-family: var(--font-mono);
          font-size: 12px;
          font-weight: 700;
        }
        .seq-steps {
          display: flex;
          flex-direction: column;
          gap: 10px;
        }
        .seq-step {
          position: relative;
          padding: 10px 14px;
          background: color-mix(in srgb, var(--bg) 60%, var(--paper));
          border: 1px solid var(--rule);
          display: flex;
          justify-content: space-between;
          align-items: center;
        }
        .seq-step.return-step {
          border-left: 4px solid var(--mark);
        }
        .seq-num {
          font-family: var(--font-mono);
          font-weight: 700;
          font-size: 11px;
          color: var(--accent);
        }
        .seq-desc {
          font-family: var(--font-mono);
          font-size: 12.5px;
        }

        /* State Machine Flow */
        .state-box {
          background: var(--paper);
          border: 1px solid var(--rule);
          border-top: 3px solid var(--mark);
          padding: 20px 22px;
          margin: 18px 0;
        }
        .state-head {
          display: flex;
          justify-content: space-between;
          margin-bottom: 16px;
          font-family: var(--font-mono);
          font-size: 12px;
          font-weight: 700;
        }
        .state-nodes-flow {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 8px;
          margin-bottom: 18px;
          flex-wrap: wrap;
        }
        .state-node {
          border: 1px solid var(--rule-strong);
          padding: 10px 14px;
          text-align: center;
          min-width: 90px;
          background: var(--paper);
        }
        .state-node.active {
          border-color: var(--accent);
          background: var(--accent-tint);
        }
        .state-node.terminal-success {
          border-color: var(--color-success);
        }
        .state-badge {
          font-family: var(--font-mono);
          font-size: 10px;
          font-weight: 700;
        }
        .state-name {
          font-size: 13px;
          font-weight: 600;
          margin-top: 2px;
        }
        .state-arrow {
          font-family: var(--font-mono);
          font-size: 11px;
          color: var(--muted);
        }

        /* Service Dependency Mesh */
        .mesh-box {
          background: var(--paper);
          border: 1px solid var(--rule);
          padding: 20px 22px;
          margin: 18px 0;
        }
        .mesh-head {
          display: flex;
          justify-content: space-between;
          margin-bottom: 16px;
          font-family: var(--font-mono);
          font-size: 12px;
          font-weight: 700;
        }
        .mesh-grid {
          display: grid;
          grid-template-columns: 1fr 1.2fr 1fr;
          gap: 16px;
          align-items: center;
        }
        .mesh-col-title {
          font-family: var(--font-mono);
          font-size: 11px;
          font-weight: 700;
          color: var(--muted);
          margin-bottom: 10px;
        }
        .mesh-card {
          border: 1px solid var(--rule);
          background: var(--paper);
          padding: 12px 14px;
          margin-bottom: 10px;
        }
        .mesh-card strong {
          display: block;
          font-size: 14px;
          margin-bottom: 4px;
        }
        .mesh-card p {
          font-size: 12px;
          color: var(--muted);
          margin: 6px 0 0;
        }
        .center-card {
          border: 2px solid var(--accent);
          background: color-mix(in srgb, var(--accent-tint) 50%, var(--paper));
          padding: 20px 18px;
        }
        .mesh-target-name {
          font-family: var(--font-sans);
          font-size: 1.25rem;
          font-weight: 700;
          margin-bottom: 4px;
        }
        .mesh-target-sub {
          font-family: var(--font-mono);
          font-size: 11.5px;
          color: var(--read-muted);
          margin-bottom: 10px;
        }
        .mesh-pills {
          display: flex;
          gap: 6px;
          flex-wrap: wrap;
        }
        .mesh-pills span {
          font-family: var(--font-mono);
          font-size: 10.5px;
          padding: 2px 8px;
          background: var(--accent-tint);
          color: var(--accent);
        }

        /* Benchmark Table */
        .benchmark-box {
          margin: 18px 0;
        }
        .benchmark-head {
          display: flex;
          justify-content: space-between;
          margin-bottom: 12px;
          font-family: var(--font-mono);
          font-size: 12px;
          font-weight: 700;
        }
        table.data tbody tr.highlight-row td,
        table.compare-table tbody tr.highlight-row td {
          background: color-mix(
            in srgb,
            var(--color-success-bg) 60%,
            var(--paper)
          );
        }

        /* Pros & Cons Tradeoff */
        .pros-cons-box {
          background: var(--paper);
          border: 1px solid var(--rule);
          padding: 22px 24px;
          margin: 18px 0;
        }
        .pros-cons-head {
          display: flex;
          justify-content: space-between;
          margin-bottom: 16px;
          font-family: var(--font-mono);
          font-size: 12px;
          font-weight: 700;
        }
        .pros-cons-grid {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 20px;
        }
        .pros-col {
          border: 1px solid var(--color-success-border);
          background: color-mix(
            in srgb,
            var(--color-success-bg) 40%,
            var(--paper)
          );
          padding: 16px 18px;
        }
        .cons-col {
          border: 1px solid var(--color-danger-border);
          background: color-mix(
            in srgb,
            var(--color-danger-bg) 40%,
            var(--paper)
          );
          padding: 16px 18px;
        }
        .pros-head,
        .cons-head {
          display: flex;
          align-items: center;
          gap: 8px;
          font-size: 15px;
          margin-bottom: 12px;
        }
        .pros-head .sign-icon {
          color: var(--color-success);
          font-weight: 700;
        }
        .cons-head .sign-icon {
          color: var(--color-danger);
          font-weight: 700;
        }
        .pros-list,
        .cons-list {
          margin: 0;
          padding-left: 1.2em;
          font-size: 13.5px;
          display: flex;
          flex-direction: column;
          gap: 8px;
        }

        /* Architecture Decision Log */
        .decision-box {
          background: var(--paper);
          border: 1px solid var(--rule);
          border-top: 3px solid var(--accent);
          padding: 20px 22px;
          margin: 18px 0;
        }
        .decision-head {
          display: flex;
          justify-content: space-between;
          margin-bottom: 16px;
          font-family: var(--font-mono);
          font-size: 12px;
          font-weight: 700;
        }
        .decision-items {
          display: flex;
          flex-direction: column;
          gap: 14px;
        }
        .decision-item {
          border: 1px solid var(--rule);
          padding: 14px 16px;
          background: color-mix(in srgb, var(--bg) 30%, var(--paper));
        }
        .decision-top {
          display: flex;
          align-items: center;
          gap: 10px;
          margin-bottom: 8px;
          flex-wrap: wrap;
        }
        .decision-id {
          font-family: var(--font-mono);
          font-weight: 700;
          color: var(--accent);
        }
        .decision-name {
          font-weight: 700;
          font-size: 15px;
          flex-grow: 1;
        }
        .decision-desc {
          font-size: 13.5px;
          margin: 0 0 10px;
        }
        .decision-footer {
          display: flex;
          gap: 14px;
          font-family: var(--font-mono);
          font-size: 11px;
          color: var(--muted);
          flex-wrap: wrap;
        }

        /* Slider / Side-by-side Comparative Frame */
        .slider-box {
          background: var(--paper);
          border: 1px solid var(--rule);
          padding: 20px 22px;
          margin: 18px 0;
        }
        .slider-head {
          display: flex;
          justify-content: space-between;
          margin-bottom: 16px;
          font-family: var(--font-mono);
          font-size: 12px;
          font-weight: 700;
        }
        .slider-container {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 16px;
        }
        .slider-pane {
          border: 1px solid var(--rule-strong);
          padding: 16px;
          background: var(--paper);
          position: relative;
        }
        .pane-badge {
          font-family: var(--font-mono);
          font-size: 11px;
          font-weight: 700;
          margin-bottom: 10px;
          color: var(--muted);
        }
        .pane-badge.active {
          color: var(--accent);
        }
        .pane-mockup {
          border: 1px dashed var(--rule);
          padding: 20px;
          font-size: 13.5px;
        }
        .legacy-mockup {
          background: var(--bg);
          opacity: 0.85;
        }
        .editorial-mockup {
          background: color-mix(in srgb, var(--accent-tint) 50%, var(--paper));
          border-color: var(--accent);
        }

        /* Incident Severity Header */
        .incident-header-box {
          background: var(--paper);
          border: 2px solid var(--color-danger);
          margin: 18px 0;
        }
        .incident-top-strip {
          display: flex;
          justify-content: space-between;
          align-items: center;
          background: var(--color-danger-bg);
          color: var(--color-danger);
          border-bottom: 1px solid var(--color-danger-border);
          padding: 8px 16px;
          font-family: var(--font-mono);
          font-weight: 700;
          font-size: 12px;
        }
        .incident-main-grid {
          display: grid;
          grid-template-columns: minmax(0, 1.4fr) minmax(240px, 0.6fr);
          gap: 24px;
          padding: 22px 24px;
        }
        .incident-title {
          font-family: var(--font-sans);
          font-size: 1.35rem;
          font-weight: 700;
          margin-bottom: 8px;
        }
        .incident-cause {
          font-size: 14.5px;
          color: var(--muted);
          margin: 0;
        }
        .incident-impact-stats {
          display: flex;
          flex-direction: column;
          gap: 8px;
          border-left: 1px solid var(--rule);
          padding-left: 20px;
        }
        .impact-item {
          display: flex;
          justify-content: space-between;
          font-size: 13.5px;
        }
        .impact-label {
          color: var(--muted);
        }
        .impact-val {
          font-family: var(--font-mono);
          font-weight: 700;
        }

        /* Fine-grained Incident Clock Timeline */
        .incident-timeline-box {
          background: var(--paper);
          border: 1px solid var(--rule);
          border-top: 3px solid var(--color-danger);
          padding: 20px 22px;
          margin: 18px 0;
        }
        .incident-timeline-head {
          display: flex;
          justify-content: space-between;
          margin-bottom: 16px;
          font-family: var(--font-mono);
          font-size: 12px;
          font-weight: 700;
        }
        .inc-timeline {
          display: flex;
          flex-direction: column;
          gap: 14px;
          position: relative;
          padding-left: 20px;
        }
        .inc-timeline::before {
          content: "";
          position: absolute;
          left: 86px;
          top: 8px;
          bottom: 8px;
          width: 2px;
          background: var(--rule);
        }
        .inc-time-row {
          display: flex;
          align-items: flex-start;
          gap: 24px;
          position: relative;
        }
        .inc-time {
          width: 64px;
          font-family: var(--font-mono);
          font-size: 12px;
          font-weight: 700;
          color: var(--muted);
          text-align: right;
          flex-shrink: 0;
        }
        .inc-dot {
          width: 10px;
          height: 10px;
          border-radius: 50%;
          background: var(--accent);
          flex-shrink: 0;
          margin-top: 4px;
          z-index: 1;
        }
        .inc-time-row.danger .inc-dot {
          background: var(--color-danger);
        }
        .inc-time-row.warn .inc-dot {
          background: var(--mark);
        }
        .inc-time-row.success .inc-dot {
          background: var(--color-success);
        }
        .inc-content strong {
          display: block;
          font-size: 14px;
          margin-bottom: 2px;
        }
        .inc-content p {
          font-size: 13px;
          color: var(--muted);
          margin: 0;
        }

        /* 5-Whys Root Cause Chain */
        .why-box {
          background: var(--paper);
          border: 1px solid var(--rule);
          padding: 20px 22px;
          margin: 18px 0;
        }
        .why-head {
          display: flex;
          justify-content: space-between;
          margin-bottom: 16px;
          font-family: var(--font-mono);
          font-size: 12px;
          font-weight: 700;
        }
        .why-chain {
          display: flex;
          flex-direction: column;
          gap: 10px;
        }
        .why-node {
          border: 1px solid var(--rule);
          padding: 12px 14px;
          background: color-mix(in srgb, var(--bg) 40%, var(--paper));
        }
        .why-node.root-why {
          border: 2px solid var(--color-danger);
          background: color-mix(
            in srgb,
            var(--color-danger-bg) 50%,
            var(--paper)
          );
        }
        .why-step {
          font-family: var(--font-mono);
          font-size: 11px;
          font-weight: 700;
          color: var(--accent);
          margin-bottom: 4px;
        }
        .why-step.root-badge {
          color: var(--color-danger);
          font-size: 12px;
        }
        .why-node p {
          margin: 0 0 4px;
          font-size: 14px;
        }
        .why-ans {
          font-size: 13px;
          color: var(--muted);
          font-family: var(--font-sans);
        }

        /* Action Items CAPA */
        .action-box {
          margin: 18px 0;
        }
        .action-head {
          display: flex;
          justify-content: space-between;
          margin-bottom: 12px;
          font-family: var(--font-mono);
          font-size: 12px;
          font-weight: 700;
        }

        /* Release Notes / Changelog */
        .release-box {
          background: var(--paper);
          border: 1px solid var(--rule);
          border-top: 3px solid var(--accent);
          padding: 20px 22px;
          margin: 18px 0;
        }
        .release-head {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 16px;
          padding-bottom: 12px;
          border-bottom: 1px solid var(--rule);
        }
        .release-version {
          display: flex;
          align-items: baseline;
          gap: 10px;
        }
        .ver-tag {
          font-family: var(--font-mono);
          font-size: 11px;
          font-weight: 700;
          color: var(--accent);
        }
        .release-version strong {
          font-family: var(--font-sans);
          font-size: 1.4rem;
        }
        .ver-date {
          font-family: var(--font-mono);
          font-size: 12px;
          color: var(--muted);
        }
        .release-sections {
          display: flex;
          flex-direction: column;
          gap: 14px;
        }
        .sec-title {
          font-family: var(--font-mono);
          font-size: 12.5px;
          font-weight: 700;
          margin-bottom: 6px;
        }

        /* Gantt Roadmap (Mermaid gantt · Pele Rendered + Legacy Grid Fallback) */
        .gantt-box {
          background: var(--paper);
          border: 1px solid var(--rule);
          border-top: 3px solid var(--accent);
          padding: 20px 22px;
