          justify-content: center;
          gap: 30px;
          align-items: center;
          font-size: var(--fs-xs);
          color: var(--read-muted);
          text-align: center;
          padding: 0 6px;
        }
        .qa-mid > div {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 3px;
          line-height: 1.45;
        }
        .qa-mid b {
          font-size: 20px;
          line-height: 1;
        }
        .qa-mid .go b {
          color: var(--color-success);
        }
        .qa-mid .back b {
          color: var(--mark);
        }
        .qa-rule {
          margin-top: var(--s-4);
          padding: 12px 14px;
          border-radius: var(--radius-sm);
          border: 1px solid color-mix(in srgb, var(--rose) 20%, var(--line));
          background: color-mix(in srgb, var(--rose) 4%, var(--paper));
          font-size: var(--fs-sm);
          line-height: 1.7;
          text-align: left;
          color: var(--ink);
        }
        .qa-rule b,
        .qa-rule strong {
          color: var(--rose);
        }

        /* BudgetBars · 截止与资源预算条 */
        .dl {
          border: 1px solid var(--line);
          border-radius: var(--radius);
          padding: 20px var(--s-5);
          background: var(--surface);
        }
        .dl-head {
          display: flex;
          justify-content: space-between;
          align-items: center;
          gap: var(--s-2);
          margin-bottom: var(--s-3);
          padding-bottom: 10px;
          border-bottom: 1px solid var(--line-soft);
        }
        .dl-title {
          font-family: var(--font-mono);
          font-size: var(--fs-xs);
          font-weight: 600;
          letter-spacing: 0.04em;
          color: var(--accent);
        }
        .dl-meta {
          font-size: var(--fs-xs);
          color: var(--read-muted);
        }
        .dl-row {
          display: grid;
          grid-template-columns: 140px minmax(0, 1fr);
          gap: 12px;
          align-items: center;
          margin: 10px 0;
        }
        .dl-row > b {

          border-radius: var(--radius);
          background: var(--surface);

          counter-increment: pr;

          top: var(--s-4);

          height: 28px;

          border-radius: var(--radius-sm);
          background: var(--surface-2);
          font-size: var(--fs-sm);
          line-height: 1.7;
          color: var(--read-muted);

            h2,
            h3,

            h5,
            h6,

          }

          }

                    bounds.yTop +

                    tx +
                    "," +
                    bounds.yBottom +

              ),
            );
            taskNodes.forEach(function (tg) {

                label.setAttribute("x", (rx + rw / 2).toFixed(2));
                if (tw > rw - 14) {
                  label.setAttribute(
                    "textLength",
                    Math.max(40, rw - 14).toFixed(1),
                  );
                  label.setAttribute("lengthAdjust", "spacingAndGlyphs");
                }
              } else {
                label.classList.add("is-outside");
              }
            });

            // 4. 贯穿竖线标记 (.pele-vert) 顶部菱形锚点 + 底部胶囊标签框 (.pele-vert-box)
            var vertPaths = [].slice.call(
              svg.querySelectorAll(".pele-verts > path.pele-vert"),
            );
            var vertLabelsGroup = svg.querySelector(".pele-vert-labels");
            var vertMap = {};
            vertPaths.forEach(function (vp) {
              var id = vp.getAttribute("data-id") || "";
              var vm = (vp.getAttribute("d") || "").match(
                /M([\d.]+),([\d.]+)V([\d.]+)/,
              );
              if (!vm) return;
              var vx = +vm[1];
              var vy0 = +vm[2];
              var vy1 = +vm[3];
              if (id) vertMap[id] = { path: vp, x: vx, y0: vy0, y1: vy1 };
              var cap = svgEl("polygon", {
                class: "pele-vert-cap",
                points:
                  vx +
                  "," +
                  (vy0 - 4.5) +
                  " " +
                  (vx + 4.5) +
                  "," +
                  vy0 +
                  " " +
                  vx +
                  "," +
                  (vy0 + 4.5) +
                  " " +
                  (vx - 4.5) +
                  "," +
                  vy0,
              });
              vp.parentNode.appendChild(cap);
            });
            if (vertLabelsGroup) {
              var maxBottom = vbH;
              var vLabels = [].slice.call(
                vertLabelsGroup.querySelectorAll("text.pele-vert-label"),
              );
              vLabels.forEach(function (lt) {
                var lid = lt.getAttribute("data-id") || "";
                var lx = +(lt.getAttribute("x") || 0);
                var ly = +(lt.getAttribute("y") || 0);
                var tw = measureTextWidth(lt) + 22;
                var th = 22;
                var bx = Math.max(4, Math.min(vbW - tw - 4, lx - tw / 2));
                var by = ly - 13;
                lt.setAttribute("x", (bx + tw / 2).toFixed(2));
                lt.setAttribute("y", (by + 15).toFixed(2));
                var box = svgEl("rect", {
                  class: "pele-vert-box",
                  x: bx.toFixed(2),
                  y: by.toFixed(2),
                  width: tw.toFixed(2),
                  height: th,
                  rx: 6,
                });
                vertLabelsGroup.insertBefore(box, lt);
                if (lid && vertMap[lid]) {
                  var info = vertMap[lid];
                  info.path.setAttribute(
                    "d",
                    "M" + info.x + "," + info.y0 + "V" + by.toFixed(2),
                  );
                }
                if (by + th + 4 > maxBottom) maxBottom = Math.ceil(by + th + 4);
              });
              if (maxBottom > vbH) {
                svg.setAttribute(
                  "viewBox",
                  vb[0] + " " + vb[1] + " " + vbW + " " + maxBottom,
                );
                svg.setAttribute("height", String(maxBottom));
              }
            }
          }
          var peleUrls = [
            "https://fastly.jsdelivr.net/npm/pele@1.6.0/dist/pele.global.js",
            "https://cdn.jsdelivr.net/npm/pele@1.6.0/dist/pele.global.js",
            "https://unpkg.com/pele@1.6.0/dist/pele.global.js",
          ];
          function onPeleReady() {
            if (!window.pele || typeof window.pele.mount !== "function") {
              nodes.forEach(diagramFailure);
              return;
            }
            nodes.forEach(function (el) {
              try {
                var src = el.textContent.trim();
                var isGantt =
                  (typeof window.pele.detectType === "function" &&
                    window.pele.detectType(src) === "gantt") ||
                  /^\s*(?:%%\{[\s\S]*?\}%%\s*)*gantt\b/i.test(src);
                var opts = isGantt
                  ? {
                      zoom: false,
                      maxWidth: 920,
                      config: {
                        gantt: {
                          topAxis: true,
                          useWidth: 920,
                          barHeight: 26,
                          barGap: 8,
                          fontSize: 12,
                          sectionFontSize: 12,
                        },
                      },
                      onRender: function () {
                        enhanceGanttSvg(el);
                      },
                    }
                  : {};
                window.pele.mount(el, src, opts);
                setTimeout(function () {
                  if (!el.querySelector("svg")) diagramFailure(el);
                }, 1000);
              } catch (e) {
                diagramFailure(el);
              }
            });
          }
          loadScriptChain(peleUrls, null, 4500, onPeleReady, function () {
            nodes.forEach(diagramFailure);
          });
        })();

        document.addEventListener("click", function (ev) {
          var btn = ev.target.closest("[data-theme-set]");
          if (btn) apply(btn.getAttribute("data-theme-set"), true);
        });
      })();
    </script>
    <script>
      /* 双侧栏运行时：左侧文档集导航（#report-nav-data 快照，HTTP 下热刷新）、右侧本文目录 */
      (function () {
        "use strict";

        var navSlot = document.getElementById("report-nav-data");
        var railNav = document.querySelector(".rail-nav");
        var railToc = document.querySelector(".rail-toc");
        var drawer = document.querySelector(".rail-drawer");
        var drawerBody = drawer
          ? drawer.querySelector(".rail-drawer-body")
          : null;
        var drawerTitle = drawer
          ? drawer.querySelector(".rail-drawer-head .rail-title")
          : null;
        var drawerPanel = drawer
          ? drawer.querySelector(".rail-drawer-panel")
          : null;

        var navContentEl = null;
        var tocContentEl = null;
        var navModel = null;
        var tocEntries = [];
        var tocLinks = [];
        var spyMark = null;
        var lastFocus = null;

        function el(tag, cls, text) {
          var n = document.createElement(tag);
          if (cls) n.className = cls;
          if (text != null) n.textContent = text;
          return n;
        }

        /* ---------- 导航数据 ---------- */

        function normalizeItems(list) {
          var out = [];
          if (!Array.isArray(list)) return out;
          list.forEach(function (it) {
            if (!it || typeof it.file !== "string" || !it.file) return;
            if (typeof it.title !== "string" || !it.title) return;
            out.push({
              file: it.file.replace(/\\/g, "/").replace(/^\.\//, ""),
              title: it.title,
              desc: typeof it.desc === "string" ? it.desc : "",
              tag: typeof it.tag === "string" ? it.tag : "",
            });
          });
          return out;
        }

        function normalizeNav(data) {
          if (!data || typeof data !== "object") return null;
          var groups = [];
          if (Array.isArray(data.groups)) {
            data.groups.forEach(function (g) {
              g = g || {};
              var items = normalizeItems(g.items);
              if (items.length)
                groups.push({
                  label: typeof g.label === "string" ? g.label : "",
                  items: items,
                });
            });
          }
          if (!groups.length) {
            var flat = normalizeItems(data.items);
            if (flat.length) groups.push({ label: "", items: flat });
          }
          if (!groups.length) return null;
          return {
            name: typeof data.name === "string" ? data.name : "",
            updated: typeof data.updated === "string" ? data.updated : "",
            groups: groups,
          };
        }

        function parseNavSlot() {
          if (!navSlot) return null;
          var raw = (navSlot.textContent || "").trim();
          if (!raw || raw === "{}") return null;
          try {
            return normalizeNav(JSON.parse(raw));
          } catch (e) {
            if (window.console)
              console.warn(
                "[report-nav] 内嵌导航 JSON 解析失败，左侧导航未启用",
                e,
              );
            return null;
          }
        }

        /* ---------- 路径与当前页 ---------- */

        function canonUrl(href) {
          var u;
          try {
            u = new URL(href, location.href);
          } catch (e) {
            return "";
          }
          var p = u.pathname;
          try {
            p = decodeURIComponent(p);
          } catch (e) {}
          return p.replace(/index\.html?$/i, "");
        }

        function flatten(model) {
          var flat = [];
          model.groups.forEach(function (g) {
            g.items.forEach(function (it) {
              flat.push(it);
            });
          });
          return flat;
        }

        function resolveBase(model) {
          var pageCanon = canonUrl(location.href);
          var candidates = [];
          if (navSlot) {
            var src = navSlot.getAttribute("data-src");
            if (src) {
              try {
                var u = new URL(src, location.href);
                u.pathname = u.pathname.replace(/[^/]*$/, "");
                candidates.push(u.href);
              } catch (e) {}
            }
          }
          try {
            var dir = new URL("./", location.href);
            for (var i = 0; i < 7; i++) {
              candidates.push(dir.href);
              var parent = new URL("../", dir.href);
              if (parent.href === dir.href) break;
              dir = parent;
            }
          } catch (e) {}
          var flat = flatten(model);
          for (var c = 0; c < candidates.length; c++) {
            for (var f = 0; f < flat.length; f++) {
              if (
                canonUrl(new URL(flat[f].file, candidates[c]).href) ===
                pageCanon
              )
                return { base: candidates[c], current: flat[f] };
            }
          }
          return { base: candidates[0] || "./", current: null };
        }

        /* ---------- 左栏：文档集导航 ---------- */

        function pagerLink(item, base, dir, rel) {
          var a = el("a", "rail-pager-link");
          a.href = new URL(item.file, base).href;
          a.rel = rel;
          a.appendChild(el("span", "rail-pager-dir", dir));
          a.appendChild(el("span", "rail-pager-title", item.title));
          return a;
        }

        function buildNavDom(model, info) {
          var frag = document.createDocumentFragment();
          var count = flatten(model).length;
          var title = el("p", "rail-title", model.name || "文档");
          title.appendChild(
            el(
              "small",
              null,
              count + " 篇" + (model.updated ? " · " + model.updated : ""),
            ),
          );
          frag.appendChild(title);
          model.groups.forEach(function (g) {
            if (g.label) frag.appendChild(el("p", "rail-group-label", g.label));
            var ul = el("ul", "rail-list");
            g.items.forEach(function (it) {
              var a = el("a", "rail-link");
              a.href = new URL(it.file, info.base).href;
              var titleLine = el("span", "rail-link-title", it.title);
              if (it.tag)
                titleLine.appendChild(el("span", "rail-link-tag", it.tag));
              a.appendChild(titleLine);
              if (it.desc) a.appendChild(el("span", "rail-link-desc", it.desc));
              if (info.current && it === info.current) {
                a.classList.add("current");
                a.setAttribute("aria-current", "page");
              }
              var li = el("li");
              li.appendChild(a);
              ul.appendChild(li);
            });
            frag.appendChild(ul);
          });
          var flat = flatten(model);
          var idx = info.current ? flat.indexOf(info.current) : -1;
          if (idx > -1 && (idx > 0 || idx < flat.length - 1)) {
            var pager = el("div", "rail-pager");
            if (idx > 0)
              pager.appendChild(
                pagerLink(flat[idx - 1], info.base, "上一篇 · PREV", "prev"),
              );
            if (idx < flat.length - 1)
              pager.appendChild(
                pagerLink(flat[idx + 1], info.base, "下一篇 · NEXT", "next"),
              );
            frag.appendChild(pager);
          }
          return frag;
        }

        function renderNav(model) {
          navModel = model;
          if (!railNav) return;
          var info = resolveBase(model);
          navContentEl = el("div", "rail-content");
          navContentEl.appendChild(buildNavDom(model, info));
          railNav.replaceChildren(navContentEl.cloneNode(true));
          railNav.hidden = false;
          document.body.classList.add("rail-nav-on");
        }

        /* ---------- 右栏：本文目录 ---------- */

        function slugify(text, used) {
          var base = "";
          try {
            base = text
              .trim()
              .toLowerCase()
              .replace(/[\s\u3000]+/g, "-")
              .replace(/[^\p{L}\p{N}-]+/gu, "")
              .replace(/-{2,}/g, "-")
              .replace(/^-+|-+$/g, "");
          } catch (e) {
            base = "";
          }
          if (!base) base = "sec";
          var slug = base;
          var n = 2;
          while (used[slug]) slug = base + "-" + n++;
          used[slug] = true;
          return slug;
        }

        function extractH2Meta(h, idx) {
          var num = "";
          var headWrap = h.closest(".block-head");
          var noEl = headWrap ? headWrap.querySelector(".block-no") : null;
          if (noEl) {
            var noMatch = (noEl.textContent || "")
              .trim()
              .match(/^#?(\d{1,3})\b/);
            if (noMatch) num = noMatch[1].padStart(2, "0");
          }
          var raw = (h.textContent || "").trim().replace(/\s+/g, " ");
          var leadMatch = raw.match(/^#?(\d{1,3})\s*(?:[·.、/]|—|-)\s*(.+)$/);
          if (leadMatch) {
            if (!num) num = leadMatch[1].padStart(2, "0");
            raw = leadMatch[2].trim();
          }
          if (!num) num = String(idx).padStart(2, "0");
          return { num: num, text: raw };
        }

        function cleanH3Text(h, hasGroups) {
          var raw = (h.textContent || "").trim().replace(/\s+/g, " ");
          if (hasGroups) {
            var m = raw.match(/^\d{1,3}\s*·\s*(.+)$/);
            if (m) return m[1].trim();
          }
          return raw;
        }

        function isTocExcluded(h) {
          if (
            h.closest(
              ".rail, .rail-drawer, .hero, .system-map, .callout, .compare-card, .stat-card, [data-toc-ignore]",
            )
          )
            return true;
          if (h.tagName === "H2") {
            var blk = h.closest(".block, .open");
            if (blk && blk.parentElement && blk.parentElement.closest(".block"))
              return true;
          }
          return false;
        }

        function buildTocDom() {
          var heads = [].slice
            .call(document.querySelectorAll(".sheet :is(h2, h3)"))
            .filter(function (h) {
              return !isTocExcluded(h) && (h.textContent || "").trim();
            });
          if (heads.length < 3) return null;
          var used = {};
          var hasH2 = heads.some(function (h) {
            return h.tagName === "H2";
          });
          var frag = document.createDocumentFragment();
          var ol = el("ol", "rail-toc-list");
          var currentGroup = null;
          var groupCount = 0;

          heads.forEach(function (h) {
            if (!h.id) h.id = slugify(h.textContent, used);
            tocEntries.push({ id: h.id, el: h });
            if (h.tagName === "H2" || !hasH2) {
              groupCount += 1;
              var meta = extractH2Meta(h, groupCount);
              var groupLi = el("li", "rail-toc-group");
              var a = el("a", "rail-toc-link lv2");
              a.href = "#" + h.id;
              a.title = meta.text;
              a.appendChild(el("span", "rail-toc-no", meta.num));
              a.appendChild(el("span", "rail-toc-text", meta.text));
              groupLi.appendChild(a);
              ol.appendChild(groupLi);
              currentGroup = { li: groupLi, sub: null };
            } else {
              var label = cleanH3Text(h, hasH2);
              var subA = el("a", "rail-toc-link lv3");
              subA.href = "#" + h.id;
              subA.title = label;
              subA.appendChild(el("span", "rail-toc-text", label));
              var subLi = el("li");
              subLi.appendChild(subA);
              if (currentGroup) {
                if (!currentGroup.sub) {
                  currentGroup.sub = el("ul", "rail-toc-sub");
                  currentGroup.li.appendChild(currentGroup.sub);
                }
                currentGroup.sub.appendChild(subLi);
              } else {
                var orphanLi = el("li", "rail-toc-group");
                orphanLi.appendChild(subA);
                ol.appendChild(orphanLi);
              }
            }
          });

          var title = el("p", "rail-title", "本文目录");
          title.appendChild(
            el("small", null, (groupCount || heads.length) + " 节"),
          );
          frag.appendChild(title);
          frag.appendChild(ol);
          return frag;
        }

        function ensureTocMounted() {
          if (!railToc) return;
          var mainEl = document.querySelector(
            ".sheet-body > main, .sheet > main, main",
          );
          if (!mainEl) return;
          var bodyWrap = mainEl.parentElement;
          if (!bodyWrap.classList.contains("sheet-body")) {
            bodyWrap = el("div", "sheet-body");
            mainEl.parentNode.insertBefore(bodyWrap, mainEl);
            bodyWrap.appendChild(mainEl);
          }
          if (railToc.parentElement !== bodyWrap) {
            bodyWrap.appendChild(railToc);
          }
        }

        function renderToc() {
          if (!railToc) return;
          ensureTocMounted();
          tocEntries = [];
          var frag = buildTocDom();
          if (!frag) return;
          tocContentEl = el("div", "rail-content");
          tocContentEl.appendChild(frag);
          railToc.replaceChildren(tocContentEl.cloneNode(true));
          railToc.hidden = false;
          tocLinks = [].slice.call(railToc.querySelectorAll("a.rail-toc-link"));
          document.body.classList.add("rail-toc-on");
          spy();
        }

        /* ---------- 滚动高亮 ---------- */

        function syncTocState(rootEl, activeIdx) {
          if (!rootEl) return null;
          var links = [].slice.call(rootEl.querySelectorAll("a.rail-toc-link"));
          var groups = [].slice.call(
            rootEl.querySelectorAll(".rail-toc-group"),
          );
          groups.forEach(function (g) {
            g.classList.remove("in-view");
          });
          var activeLink = null;
          links.forEach(function (a, i) {
            var on = i === activeIdx;
            a.classList.toggle("on", on);
            if (on) {
              a.setAttribute("aria-current", "true");
              activeLink = a;
            } else {
              a.removeAttribute("aria-current");
            }
          });
          if (activeLink) {
            var grp = activeLink.closest(".rail-toc-group");
            if (grp) grp.classList.add("in-view");
          }
          return activeLink;
        }

        function spy() {
          if (!tocEntries.length) return;
          var mark = tocEntries[0];
          for (var i = 0; i < tocEntries.length; i++) {
            if (tocEntries[i].el.getBoundingClientRect().top <= 120)
              mark = tocEntries[i];
            else break;
          }
          if (mark === spyMark) return;
          spyMark = mark;
          var activeIdx = mark ? tocEntries.indexOf(mark) : -1;
          var active = syncTocState(railToc, activeIdx);
          if (
            active &&
            railToc &&
            window.matchMedia &&
            window.matchMedia("(min-width: 1240px)").matches
          ) {
            var navRect = railToc.getBoundingClientRect();
            var titleEl = railToc.querySelector(".rail-title");
            var topBound =
              (titleEl ? titleEl.getBoundingClientRect().bottom : navRect.top) +
              14;
            var botBound = navRect.bottom - 24;
            var linkRect = active.getBoundingClientRect();
            if (linkRect.top < topBound) {
              railToc.scrollTop -= topBound - linkRect.top;
            } else if (linkRect.bottom > botBound) {
              railToc.scrollTop += linkRect.bottom - botBound;
            }
          }
        }

        /* ---------- 窄屏按钮与抽屉 ---------- */

        function makeToggle(kind, label, iconPath) {
          var b = document.createElement("button");
          b.type = "button";
          b.className = "rail-toggle";
          b.setAttribute("data-rail-open", kind);
          b.setAttribute("aria-haspopup", "dialog");
          b.innerHTML =
            '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
            iconPath +
            "</svg>";
          b.appendChild(document.createTextNode(label));
          return b;
        }

        function mountToggles() {
          var topRight = document.querySelector(".top-right");
          if (!topRight) return;
          var group = document.createElement("div");
          group.className = "rail-toggles";
          group.setAttribute("role", "group");
          group.setAttribute("aria-label", "侧栏导航");
          if (navContentEl)
            group.appendChild(
              makeToggle(
                "nav",
                "文档",
                '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/>',
              ),
            );
          if (tocContentEl)
            group.appendChild(
              makeToggle(
                "toc",
                "目录",
                '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
              ),
            );
          if (!group.childNodes.length) return;
          topRight.insertBefore(group, topRight.querySelector(".theme"));
          document.body.classList.add("rail-on");
        }

        function drawerOpen(kind) {
          if (!drawer || !drawerBody) return;
          var sourceEl = kind === "toc" ? tocContentEl : navContentEl;
          if (!sourceEl) return;
          lastFocus = document.activeElement;
          drawer.setAttribute("data-side", kind);
          var heading =
            kind === "toc" ? "本文目录" : (navModel && navModel.name) || "文档";
          var srcTitle = sourceEl.querySelector(".rail-title");
          if (srcTitle) {
            drawerTitle.replaceChildren();
            [].slice.call(srcTitle.childNodes).forEach(function (node) {
              drawerTitle.appendChild(node.cloneNode(true));
            });
          } else {
            drawerTitle.textContent = heading;
          }
          if (drawerPanel) drawerPanel.setAttribute("aria-label", heading);
          drawerBody.replaceChildren(sourceEl.cloneNode(true));
          if (kind === "toc" && spyMark) {
            syncTocState(drawerBody, tocEntries.indexOf(spyMark));
          }
          drawer.hidden = false;
          document.body.classList.add("rail-drawer-lock");
          requestAnimationFrame(function () {
            drawer.classList.add("open");
            requestAnimationFrame(function () {
              drawer.classList.add("in");
            });
          });
          if (drawerPanel) {
            drawerPanel.setAttribute("tabindex", "-1");
            drawerPanel.focus();
          }
        }

        function drawerClose() {
          if (!drawer || drawer.hidden) return;
          drawer.classList.remove("in");
          setTimeout(function () {
            drawer.classList.remove("open");
            drawer.hidden = true;
            document.body.classList.remove("rail-drawer-lock");
            if (lastFocus && lastFocus.focus) {
              try {
                lastFocus.focus();
              } catch (e) {}
            }
          }, 240);
        }

        /* ---------- 事件 ---------- */

        document.addEventListener("click", function (ev) {
          var t = ev.target;
          if (!t || !t.closest) return;
          var opener = t.closest("[data-rail-open]");
          if (opener) {
            drawerOpen(opener.getAttribute("data-rail-open"));
            return;
          }
          if (t.closest("[data-rail-close]")) {
            drawerClose();
            return;
          }
          var hashLink = t.closest(
            '.rail a[href^="#"], .rail-drawer a[href^="#"]',
          );
          if (hashLink) {
            var id = "";
            try {
              id = decodeURIComponent(hashLink.hash.slice(1));
            } catch (e) {
              id = hashLink.hash.slice(1);
            }
            var target = id && document.getElementById(id);
            var wrap = target && target.closest("details");
            if (wrap && !wrap.open) wrap.open = true;
            if (drawer && !drawer.hidden && hashLink.closest(".rail-drawer"))
              drawerClose();
          }
        });

        document.addEventListener("keydown", function (ev) {
          if (ev.key === "Escape" && drawer && !drawer.hidden) drawerClose();
        });

        var ticking = false;
        function rafSpy() {
          if (ticking) return;
          ticking = true;
          requestAnimationFrame(function () {
            ticking = false;
            spy();
          });
        }
        window.addEventListener("scroll", rafSpy, { passive: true });
        window.addEventListener("resize", rafSpy);
        window.addEventListener("load", rafSpy);

        /* ---------- 启动 ---------- */

        var slotModel = parseNavSlot();
        if (slotModel) renderNav(slotModel);
        renderToc();
        mountToggles();

        /* HTTP 下按 data-src 热刷新导航快照（file:// 双击打开时静默跳过） */
        if (
          navSlot &&
          window.__XSU_CONFIG__?.network !== "offline" &&
          /^https?:$/.test(location.protocol)
        ) {
          var src = navSlot.getAttribute("data-src");
          if (src) {
            fetch(src, { cache: "no-store" })
              .then(function (r) {
                return r.ok ? r.json() : null;
              })
              .then(function (data) {
                if (!data || !navModel) return;
                var fresh = normalizeNav(data);
                if (
                  !fresh ||
                  JSON.stringify(fresh) === JSON.stringify(navModel)
                )
                  return;
                renderNav(fresh);
              })
              .catch(function () {});
          }
        }
      })();
    </script>
  </body>
</html>
