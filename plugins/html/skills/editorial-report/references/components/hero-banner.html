<!-- 模块：大题图/专题横幅封面 (Banner Hero) -->
<!-- 适用场景：年度大刊、技术调研报告、重大故障复盘，顶部需要视觉展位或大标签组 -->
<header data-component="hero-banner" class="hero hero-banner">
  <div class="hero-banner-main">
    <div class="hero-tags">
      <span class="label confirmed">年度特刊</span>
      <span class="badge badge-done">APPROVED</span>
    </div>
    <p class="kicker">REPORT / SPECIAL EDITION</p>
    <h1><span class="title-copy">【替换：大标题】</span></h1>
    <p class="lede">【替换：导语说明。交代调研背景、核心结论与阅读指引。】</p>
  </div>
  <div class="hero-banner-figure">
    <div class="hero-figure-box">
      <!-- 可放置架构图、关键截图或占位图 -->
      <div class="hero-figure-placeholder">
        <span class="hero-figure-tag">FEATURED VISUAL</span>
        <div class="hero-figure-title">【替换：封面图示或架构缩略】</div>
      </div>
    </div>
  </div>
</header>
