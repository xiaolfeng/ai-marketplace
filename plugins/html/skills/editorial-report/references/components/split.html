<!-- 模块：1.2fr / 0.8fr 左右分栏布局 (Split Columns) -->
<!-- 适用场景：左侧主叙述 + 右侧技术细节/代码配置/侧边备注 -->
<div data-component="split" class="split">
  <section class="block">
    <p class="kicker">主要进展与说明</p>
    <h2>左侧主叙述板块</h2>
    <p>在此编写主要业务逻辑、演进结论或关键架构变化说明。</p>
    <ul class="bits">
      <li>关键改动点一</li>
      <li>关键改动点二</li>
    </ul>
  </section>

  <section class="block">
    <p class="kicker">附注与细节</p>
    <h2>右侧侧栏板块</h2>
    <p>在此放置对照代码、环境变量、注意事项或相关链接。</p>
  </section>
</div>
