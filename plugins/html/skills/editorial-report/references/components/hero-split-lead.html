<!-- 模块：导语前置分栏封面 (Split Lead Hero) -->
<!-- 适用场景：深度复盘、重磅长文、思想周刊，左侧大标题与作者，右侧全幅加粗导语 -->
<header class="hero hero-split-lead" data-component="hero-split-lead">
  <div class="split-lead-left">
    <p class="kicker">DEEP DIVE / 深度特刊</p>
    <h1><span class="title-copy">【替换：深度专题大标题】</span></h1>
    <div class="split-lead-byline">
      <span>文 / 【替换：作者】</span>
      <span>阅读时间 · 【约 8 分钟】</span>
    </div>
  </div>
  <div class="split-lead-right">
    <div class="split-lead-box">
      <div class="split-lead-tag">EXECUTIVE SUMMARY</div>
      <p class="split-lead-text">【替换：加粗核心导语。一针见血指出此次调研或复盘的核心痛点、根本成因与战略定调。】</p>
      <div class="split-lead-footer">
        <span class="label confirmed">已全量回溯</span>
        <span class="label reported">已核对 14 处证据</span>
      </div>
    </div>
  </div>
</header>
