<!-- 模块：干系人与人员职责矩阵卡 (Personnel & Stakeholder Grid) -->
<!-- 适用场景：项目负责人清单、故障应急响应团队表、PR Reviewer 分工 -->
<div class="personnel-grid" data-component="personnel-grid">
  <div class="personnel-card">
    <div class="personnel-head">
      <div class="personnel-avatar">筱</div>
      <div>
        <div class="personnel-name">【负责人姓名】</div>
        <div class="personnel-dept">【部门 / 团队】</div>
      </div>
    </div>
    <div class="personnel-role"><span class="badge badge-done">PROJECT OWNER</span></div>
    <p class="personnel-desc">【负责整体架构决策、核心代码实现与版本交付推进。】</p>
  </div>

  <div class="personnel-card">
    <div class="personnel-head">
      <div class="personnel-avatar">审</div>
      <div>
        <div class="personnel-name">【评审人姓名】</div>
        <div class="personnel-dept">【部门 / 团队】</div>
      </div>
    </div>
    <div class="personnel-role"><span class="badge badge-progress">TECH REVIEWER</span></div>
    <p class="personnel-desc">【负责代码质量审查、合同向后兼容性核验与合入批准。】</p>
  </div>

  <div class="personnel-card">
    <div class="personnel-head">
      <div class="personnel-avatar">运</div>
      <div>
        <div class="personnel-name">【SRE 负责人】</div>
        <div class="personnel-dept">【基础架构团队】</div>
      </div>
    </div>
    <div class="personnel-role"><span class="badge badge-plan">SRE & OPS</span></div>
    <p class="personnel-desc">【负责线上容量评估、告警阈值配置与灰度发布护航。】</p>
  </div>
</div>
