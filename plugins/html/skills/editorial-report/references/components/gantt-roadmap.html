<!-- 模块：季度路线图与甘特排期 (Roadmap & Gantt Bar) -->
<!-- 适用场景：季度规划、多团队并行排期、大项目里程碑进度甘特图 -->
<div class="gantt-box" data-component="gantt-roadmap">
  <div class="gantt-head">
    <span class="gantt-title">QUARTERLY ROADMAP / 季度工程排期路线图</span>
    <span class="gantt-meta">2026 Q3 · MONTHLY TRACKS</span>
  </div>
  <div class="gantt-grid">
    <div class="gantt-timeline-header">
      <span class="gantt-task-col">任务项目</span>
      <span class="gantt-month">7月 (July)</span>
      <span class="gantt-month">8月 (Aug)</span>
      <span class="gantt-month">9月 (Sept)</span>
    </div>
    <div class="gantt-row">
      <div class="gantt-task-title">01 · 插件市场架构拆分</div>
      <div class="gantt-track-area">
        <div class="gantt-bar done" style="left:0%; width:66%;">已完成 100%</div>
      </div>
    </div>
    <div class="gantt-row">
      <div class="gantt-task-title">02 · 研究特刊壳与组件库</div>
      <div class="gantt-track-area">
        <div class="gantt-bar active" style="left:33%; width:66%;">进行中 85%</div>
      </div>
    </div>
    <div class="gantt-row">
      <div class="gantt-task-title">03 · 全量业务服务推广</div>
      <div class="gantt-track-area">
        <div class="gantt-bar plan" style="left:66%; width:34%;">规划中</div>
      </div>
    </div>
  </div>
</div>
