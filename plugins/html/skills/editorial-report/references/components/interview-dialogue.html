<!-- 模块：双人访谈与问答对话录 (Interview Q&A Dialogue) -->
<!-- 适用场景：负责人答疑、技术专访、架构复盘对话记录 -->
<div class="interview-box" data-component="interview-dialogue">
  <div class="interview-head">
    <span class="interview-title">ARCHITECT INTERVIEW / 架构负责人对话录</span>
    <span class="interview-meta">TRANSCRIPT / 问答实录</span>
  </div>
  <div class="dialogue-list">
    <div class="dialogue-item q-item">
      <div class="speaker-tag q-tag">问 · 评审方</div>
      <div class="dialogue-bubble">
        <p>这次报表视觉全面重构，为什么选择柔和圆角配合纸白墨蓝，而不是满屏仪表盘？</p>
      </div>
    </div>
    <div class="dialogue-item a-item">
      <div class="speaker-tag a-tag">答 · 架构负责人</div>
      <div class="dialogue-bubble">
        <p>技术报告是给工程师和管理层做严肃决策看的，不是营销落地页。衬线大标题、核心判断匣与克制的发丝线负责建立信任感，柔和圆角让长篇阅读不那么紧绷。</p>
      </div>
    </div>
    <div class="dialogue-item q-item">
      <div class="speaker-tag q-tag">问 · 评审方</div>
      <div class="dialogue-bubble">
        <p>组件库从 14 类扩充到 64 类后，编写报表的成本会增加吗？</p>
      </div>
    </div>
    <div class="dialogue-item a-item">
      <div class="speaker-tag a-tag">答 · 架构负责人</div>
      <div class="dialogue-bubble">
        <p>不会。64 类是查漏补缺的弹药库，写报告时依然遵守「大纲先行」，只有大纲里确定的事实才从组件库摘取对应模块填槽，零事实就不放对应模块。</p>
      </div>
    </div>
  </div>
</div>
