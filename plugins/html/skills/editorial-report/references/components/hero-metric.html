<!-- 模块：数据焦点型封面 (Metric Focal Hero) -->
<!-- 适用场景：以单一突破性核心数字为主导的汇报（如 99.99% 可用性、1.2M QPS、成本下降 60%） -->
<header data-component="hero-metric" class="hero hero-metric">
  <div class="hero-metric-content">
    <p class="kicker">PERFORMANCE HIGHLIGHT</p>
    <h1><span class="title-copy">【替换：大标题】</span></h1>
    <p class="lede">【替换：导语说明。聚焦核心数据突破的背景与业务价值。】</p>
  </div>
  <aside class="hero-metric-focal">
    <div class="focal-kicker">KEY METRIC / 核心突破</div>
    <div class="focal-num">【99.99%】</div>
    <div class="focal-label">【替换：指标名称与基线对比说明】</div>
    <div class="focal-delta delta-up">【+12.4% MoM】</div>
  </aside>
</header>
