<!-- 模块：SVG 散点分布与延迟离群图 (SVG Scatter Plot Chart) -->
<!-- 适用场景：请求 Payload 大小与耗时关系、长尾请求分布、异常慢调用离群点分析 -->
<div class="chart-box" data-component="chart-scatter">
  <div class="chart-head">
    <div>
      <div class="chart-title">【替换：请求数据包大小 vs 处理延迟分布】</div>
      <div class="chart-sub">【替换：横轴 Payload (KB) ｜ 纵轴 耗时 (ms) ｜ 红色为超限离群点】</div>
    </div>
    <div class="chart-delta delta-warn">【3 处 P99.9 离群】</div>
  </div>
  <div class="chart-svg-wrap">
    <svg class="chart-svg" viewBox="0 0 600 220" preserveAspectRatio="none" role="img" aria-label="散点图">
      <!-- 阈值红线 -->
      <line x1="40" y1="50" x2="580" y2="50" stroke="var(--color-danger)" stroke-dasharray="4 2" stroke-width="1.5" />
      <text x="575" y="44" fill="var(--color-danger)" font-family="var(--font-mono)" font-size="10" font-weight="700" text-anchor="end">SLA 200ms 警戒线</text>

      <line x1="40" y1="100" x2="580" y2="100" stroke="var(--rule)" stroke-dasharray="2 2" />
      <line x1="40" y1="150" x2="580" y2="150" stroke="var(--rule)" stroke-dasharray="2 2" />
      <line x1="40" y1="180" x2="580" y2="180" stroke="var(--rule-strong)" />

      <text x="32" y="54" class="chart-label" text-anchor="end">200ms</text>
      <text x="32" y="104" class="chart-label" text-anchor="end">100ms</text>
      <text x="32" y="154" class="chart-label" text-anchor="end">50ms</text>
      <text x="32" y="184" class="chart-label" text-anchor="end">0ms</text>

      <!-- 正常散点群 -->
      <circle cx="80" cy="165" r="3.5" fill="var(--accent)" opacity="0.7" />
      <circle cx="95" cy="158" r="3.5" fill="var(--accent)" opacity="0.7" />
      <circle cx="120" cy="148" r="3.5" fill="var(--accent)" opacity="0.7" />
      <circle cx="140" cy="140" r="3.5" fill="var(--accent)" opacity="0.7" />
      <circle cx="170" cy="135" r="3.5" fill="var(--accent)" opacity="0.7" />
      <circle cx="210" cy="120" r="3.5" fill="var(--accent)" opacity="0.7" />
      <circle cx="250" cy="115" r="3.5" fill="var(--accent)" opacity="0.7" />
      <circle cx="290" cy="108" r="3.5" fill="var(--accent)" opacity="0.7" />
      <circle cx="340" cy="95" r="3.5" fill="var(--accent)" opacity="0.7" />
      <circle cx="380" cy="90" r="3.5" fill="var(--accent)" opacity="0.7" />
      <circle cx="430" cy="80" r="3.5" fill="var(--accent)" opacity="0.7" />
      <circle cx="480" cy="72" r="3.5" fill="var(--accent)" opacity="0.7" />

      <!-- 异常离群点 -->
      <circle cx="180" cy="38" r="5.5" fill="var(--color-danger)" stroke="var(--paper)" stroke-width="2" />
      <text x="190" y="36" fill="var(--color-danger)" font-family="var(--font-mono)" font-size="10" font-weight="700">238ms (大包阻塞)</text>

      <circle cx="310" cy="28" r="5.5" fill="var(--color-danger)" stroke="var(--paper)" stroke-width="2" />
      <text x="320" y="26" fill="var(--color-danger)" font-family="var(--font-mono)" font-size="10" font-weight="700">265ms (慢SQL锁)</text>

      <!-- X 轴文字 -->
      <text x="80" y="200" class="chart-label" text-anchor="middle">10KB</text>
      <text x="210" y="200" class="chart-label" text-anchor="middle">50KB</text>
      <text x="340" y="200" class="chart-label" text-anchor="middle">100KB</text>
      <text x="480" y="200" class="chart-label" text-anchor="middle">200KB</text>
      <text x="560" y="200" class="chart-label" text-anchor="middle">500KB</text>
    </svg>
  </div>
</div>
