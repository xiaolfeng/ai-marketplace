<!-- 模块：三点核心要义卡片组合 (3-Key Takeaways Cards) -->
<!-- 适用场景：报告首屏/尾屏提炼三项关键主张、高管摘要三要点 -->
<div class="takeaways-wrap" data-component="key-takeaway-cards">
  <div class="takeaways-grid">
    <div class="takeaway-card">
      <div class="t-num">01</div>
      <div class="t-title">【系统优先于单点】</div>
      <p class="t-desc">【架构的核心竞争力在于状态长期可溯与契约自洽，而非单一组件的局部最优。】</p>
    </div>
    <div class="takeaway-card active-card">
      <div class="t-num">02</div>
      <div class="t-title">【零破绽双主题】</div>
      <p class="t-desc">【浅色用于日常阅读与打印留档，深色用于夜间投屏，移除过渡动画实现原子瞬切。】</p>
    </div>
    <div class="takeaway-card">
      <div class="t-num">03</div>
      <div class="t-title">【组件按需裁撤】</div>
      <p class="t-desc">【64 类组件为全景弹药库，真实报告按事实取材，没有对应事实决不强塞凑数。】</p>
    </div>
  </div>
</div>
