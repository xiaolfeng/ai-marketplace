<!-- 模块：移动端自适应数据表格 (Responsive Data Table) -->
<!-- 适用场景：多列结构化数据，移动端（<720px）利用 td 的 data-label 属性自动叠成卡片 -->
<div data-component="data-table" class="table-wrap">
  <table class="data">
    <thead>
      <tr>
        <th>模块名称</th>
        <th>命令 / 调用</th>
        <th>核心职责</th>
        <th>状态</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td data-label="模块名称">engineering</td>
        <td data-label="命令 / 调用">/engineering:</td>
        <td data-label="核心职责">读仓、写文档、打 PR 请 Review</td>
        <td data-label="状态"><span class="badge badge-done">就绪</span></td>
      </tr>
      <tr>
        <td data-label="模块名称">review</td>
        <td data-label="命令 / 调用">/review:</td>
        <td data-label="核心职责">合并前审查集群与缓存管理</td>
        <td data-label="状态"><span class="badge badge-done">就绪</span></td>
      </tr>
      <tr>
        <td data-label="模块名称">html</td>
        <td data-label="命令 / 调用">/html:</td>
        <td data-label="核心职责">HTML 图表、报告与组件库</td>
        <td data-label="状态"><span class="badge badge-done">就绪</span></td>
      </tr>
    </tbody>
  </table>
</div>
