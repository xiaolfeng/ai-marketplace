<!-- 模块：敏捷任务看板 (Kanban Board Columns) -->
<!-- 适用场景：周迭代任务状态、敏捷看板、项目推进协同四列视图 -->
<div class="kanban-box" data-component="kanban-board">
  <div class="kanban-head">
    <span class="kanban-title">SPRINT KANBAN / 本周迭代任务看板</span>
    <span class="kanban-meta">4 COLUMNS</span>
  </div>
  <div class="kanban-columns">
    <!-- 待办 -->
    <div class="kanban-col">
      <div class="kanban-col-head">
        <span class="col-dot"></span>
        <span>待办 (To Do)</span>
        <span class="col-count">1</span>
      </div>
      <div class="kanban-cards">
        <div class="kanban-card">
          <div class="k-title">【对齐审批流自动化】</div>
          <div class="k-meta"><span>P2</span><span>SRE</span></div>
        </div>
      </div>
    </div>
    <!-- 进行中 -->
    <div class="kanban-col">
      <div class="kanban-col-head">
        <span class="col-dot active"></span>
        <span>进行中 (Doing)</span>
        <span class="col-count">2</span>
      </div>
      <div class="kanban-cards">
        <div class="kanban-card">
          <div class="k-title">【特刊组件库扩充至 64 类】</div>
          <div class="k-meta"><span>P0</span><span>Alex</span></div>
        </div>
        <div class="kanban-card">
          <div class="k-title">【压测基准数据采集】</div>
          <div class="k-meta"><span>P1</span><span>QA</span></div>
        </div>
      </div>
    </div>
    <!-- 审查中 -->
    <div class="kanban-col">
      <div class="kanban-col-head">
        <span class="col-dot review"></span>
        <span>审查中 (Review)</span>
        <span class="col-count">1</span>
      </div>
      <div class="kanban-cards">
        <div class="kanban-card">
          <div class="k-title">【报告归档脚本 PR】</div>
          <div class="k-meta"><span>P1</span><span>Reviewer</span></div>
        </div>
      </div>
    </div>
    <!-- 已完成 -->
    <div class="kanban-col">
      <div class="kanban-col-head">
        <span class="col-dot done"></span>
        <span>已完成 (Done)</span>
        <span class="col-count">3</span>
      </div>
      <div class="kanban-cards">
        <div class="kanban-card">
          <div class="k-title">【双主题原子切换落盘】</div>
          <div class="k-meta"><span>P0</span><span>Done</span></div>
        </div>
      </div>
    </div>
  </div>
</div>
