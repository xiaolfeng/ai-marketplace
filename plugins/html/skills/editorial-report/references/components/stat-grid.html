<!-- 模块：多维 KPI 指标网格 (KPI Metrics Grid) -->
<!-- 适用场景：QPS、耗时、覆盖率、完成度等大数字指标展示，支持涨跌徽章与进度条 -->
<div data-component="stat-grid" class="stat-grid">
  <div class="stat-card">
    <div class="stat-head">
      <span class="stat-label">接口 P99 延迟</span>
      <span class="stat-delta delta-up">-35.4%</span>
    </div>
    <div class="stat-val">42 ms</div>
    <div class="stat-footer">
      <span>较重构前降低 23ms</span>
    </div>
    <div class="progress-track"><div class="progress-fill success" style="width: 85%;"></div></div>
  </div>

  <div class="stat-card">
    <div class="stat-head">
      <span class="stat-label">自动化测试覆盖率</span>
      <span class="stat-delta delta-up">+12.0%</span>
    </div>
    <div class="stat-val">94.2%</div>
    <div class="stat-footer">
      <span>通过 128/128 断言</span>
    </div>
    <div class="progress-track"><div class="progress-fill success" style="width: 94%;"></div></div>
  </div>

  <div class="stat-card">
    <div class="stat-head">
      <span class="stat-label">服务峰值 QPS</span>
      <span class="stat-delta delta-neutral">持平</span>
    </div>
    <div class="stat-val">12,450</div>
    <div class="stat-footer">
      <span>容量水位保持 38%</span>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width: 38%;"></div></div>
  </div>

  <div class="stat-card">
    <div class="stat-head">
      <span class="stat-label">阻塞级 Issue</span>
      <span class="stat-delta delta-warn">2 个</span>
    </div>
    <div class="stat-val">2</div>
    <div class="stat-footer">
      <span>需本周内拍板修复</span>
    </div>
    <div class="progress-track"><div class="progress-fill warn" style="width: 20%;"></div></div>
  </div>
</div>
