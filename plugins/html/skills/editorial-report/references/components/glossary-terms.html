<!-- 模块：专业术语与领域词典对照 (Terminology Glossary) -->
<!-- 适用场景：专业领域缩略词对照 (SLO, ADR, RTO, BFF)、技术术语定义 -->
<div class="glossary-box" data-component="glossary-terms">
  <div class="glossary-head">
    <span class="glossary-title">TERMINOLOGY GLOSSARY / 领域术语对照词典</span>
    <span class="glossary-meta">DOMAIN DEFINITIONS</span>
  </div>
  <dl class="glossary-list">
    <div class="glossary-entry">
      <dt><dfn>SLO (Service Level Objective)</dfn></dt>
      <dd>服务等级目标。SRE 团队设定的核心稳定性指标（如可用性达到 99.95%），用于衡量服务是否健康。</dd>
    </div>
    <div class="glossary-entry">
      <dt><dfn>ADR (Architecture Decision Record)</dfn></dt>
      <dd>架构决策记录。用于捕获重大架构决策、选型背景、权衡及长期约束的可审计文档。</dd>
    </div>
    <div class="glossary-entry">
      <dt><dfn>CAPA (Corrective and Preventive Actions)</dfn></dt>
      <dd>纠正与预防措施。故障复盘后设立的防再发整改项列表，明确责任人与验收上线周期。</dd>
    </div>
  </dl>
</div>
