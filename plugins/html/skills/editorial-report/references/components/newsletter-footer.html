<!-- 模块：特刊刊尾签署与版权背书栏 (Colophon & Sign-off Footer) -->

<div class="colophon-box" data-component="newsletter-footer">
  <div class="colophon-rule"></div>
  <div class="colophon-grid">
    <div class="colophon-block">
      <div class="colophon-label">EDITORIAL / 编审委员会</div>
      <p><strong>主编：</strong>【替换：主编】 ｜ <strong>技术顾问：</strong>【替换：顾问】 ｜ <strong>校对：</strong>【替换：校对】</p>
    </div>
    <div class="colophon-block">
      <div class="colophon-label">PUBLICATION / 发行声明</div>
      <p>【替换：发行声明，如生成方式、密级与转发范围】</p>
    </div>
    <div class="colophon-block colophon-seal-block">
      <div class="colophon-seal">
        <span>VERIFIED</span>
        <small>【替换：签发方】</small>
      </div>
    </div>
  </div>
</div>
