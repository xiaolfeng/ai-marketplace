<!-- 模块：系统图 / 最小可行流程 (System Map) -->
<!-- 适用场景：推断的生产链路、责任分段。深底墨色面板。节点数按事实取舍 -->
<div data-component="system-map" class="system-map" aria-label="推断的生产流程">
  <h3>最小可行生产框架 / 推断</h3>
  <div class="flow">
    <div class="node"><strong>原著解析</strong><span>章节、人物、事件与伏笔索引</span></div>
    <div class="node"><strong>状态表</strong><span>谁知道什么、关系、伤亡、道具</span></div>
    <div class="node accent"><strong>任务卡</strong><span>每个单元一个进入点、转折与尾钩</span></div>
    <div class="node"><strong>镜头单</strong><span>景别、动作、情绪、资产 ID</span></div>
    <div class="node"><strong>成片验收</strong><span>连续性、字幕、声音、规格</span></div>
  </div>
  <div class="loop">发布数据与评论 → 识别流失点 → 调整后续切分</div>
  <p class="map-note">流程图描述的是达到当前效果所需的最小能力，不代表实际岗位或软件同名。</p>
</div>
