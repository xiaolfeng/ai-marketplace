<!-- 模块：矩形进度 / 议题强度 (Meters) -->

<div data-component="meter" class="meter-row">
  <div class="meter-label">群像与角色稳定性</div>
  <div class="meter"><span style="width:92%"></span></div>
  <div class="meter-note">高度一致</div>
</div>
<div class="meter-row">
  <div class="meter-label">镜头与配乐伏笔</div>
  <div class="meter warn"><span style="width:38%"></span></div>
  <div class="meter-note">少被讨论</div>
</div>
