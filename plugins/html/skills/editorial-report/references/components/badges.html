<!-- 模块：状态徽章体系 (Status Badges) -->
<!-- 适用场景：任务状态、评审结论、模块就绪度指示 -->
<span data-component="badges" class="badge badge-done">已完成 / Done</span>
<span class="badge badge-progress">进行中 / In Progress</span>
<span class="badge badge-warn">待观察 / Warning</span>
<span class="badge badge-blocked">阻塞 / Blocked</span>
<span class="badge badge-plan">规划中 / Planned</span>
