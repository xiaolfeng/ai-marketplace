<!-- 模块：磁带跑马灯式关键指标滚动带 (Metric Tape Bar) -->
<!-- 适用场景：全景大屏、实时概览、多指标高密度并列横栏 -->
<div class="stat-tape-wrap" data-component="stat-counter-tape">
  <div class="stat-tape">
    <div class="stat-tape-item">
      <span class="tape-label">TOTAL REQUESTS</span>
      <strong class="tape-val">128.4M</strong>
      <span class="tape-delta delta-up">+8.2%</span>
    </div>
    <div class="stat-tape-item">
      <span class="tape-label">AVG LATENCY</span>
      <strong class="tape-val">24.6ms</strong>
      <span class="tape-delta delta-up">-4.1ms</span>
    </div>
    <div class="stat-tape-item">
      <span class="tape-label">SUCCESS RATE</span>
      <strong class="tape-val">99.98%</strong>
      <span class="tape-delta delta-up">PASS</span>
    </div>
    <div class="stat-tape-item">
      <span class="tape-label">ACTIVE NODES</span>
      <strong class="tape-val">64 PODS</strong>
      <span class="tape-delta delta-neutral">STABLE</span>
    </div>
    <div class="stat-tape-item">
      <span class="tape-label">CACHE HIT RATIO</span>
      <strong class="tape-val">94.8%</strong>
      <span class="tape-delta delta-up">+1.2%</span>
    </div>
  </div>
</div>
