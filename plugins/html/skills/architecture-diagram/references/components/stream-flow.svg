<svg xmlns="http://www.w3.org/2000/svg" class="architecture-component" viewBox="0 0 960 420" data-export-viewbox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="stream-flow-title stream-flow-desc">
  <title id="stream-flow-title">流式输入、处理与分支输出</title>
  <desc id="stream-flow-desc">输入流经过包含转换和聚合分区的处理组件，向主输出与次输出传递数据。</desc>
  <defs>
    <style>
      /* Default values match example.html; inherited page tokens take precedence. */
      .architecture-component { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .architecture-component[data-theme="light"] {
        --bg-canvas: #f8fafc;
        --node-base: #ffffff;
        --grid-line: rgba(100, 116, 139, 0.08);
        --grid-dot: rgba(100, 116, 139, 0.22);
        --c-client: #0284c7;
        --c-gateway: #0369a1;
        --c-service: #059669;
        --c-storage: #d97706;
        --c-security: #e11d48;
        --c-message: #7c3aed;
        --c-boundary: rgba(100, 116, 139, 0.35);
        --c-boundary-text: #334155;
        --node-title-fill: #0f172a;
        --node-sub-fill: #475569;
        --line-label-fill: #475569;
      }
      .architecture-component .node-title { fill: var(--node-title-fill, #f8fafc); font-size: 11.5px; font-weight: 600; }
      .architecture-component .node-subtitle { fill: var(--node-sub-fill, #94a3b8); font-family: "JetBrains Mono", monospace; font-size: 9px; font-weight: 400; }
      .architecture-component .node-tag { font-family: "JetBrains Mono", monospace; font-size: 8px; font-weight: 600; }
      .architecture-component .line-label { fill: var(--line-label-fill, #94a3b8); font-family: "JetBrains Mono", monospace; font-size: 8.5px; font-weight: 600; }
      .architecture-component .boundary-title { fill: var(--c-boundary-text, #94a3b8); font-family: "JetBrains Mono", monospace; font-size: 10px; font-weight: 600; }
      .architecture-component .region-title { font-family: "JetBrains Mono", monospace; font-size: 9px; font-weight: 600; }
    </style>
    <pattern id="stream-flow-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="var(--grid-line, rgba(148, 163, 184, 0.05))" stroke-width="0.75"/>
      <circle cx="0" cy="0" r="0.8" fill="var(--grid-dot, rgba(148, 163, 184, 0.18))"/>
    </pattern>
    <marker id="stream-flow-arrow-message" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.5, 7 3, 0 5.5" fill="var(--c-message, #8b5cf6)"/>
    </marker>
    <g id="stream-flow-icon-layers">
      <path d="M2 5.5 8 2l6 3.5-6 3.5-6-3.5Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M2 9.5 8 13l6-3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
    <g id="stream-flow-icon-server">
      <rect x="2" y="2" width="12" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <rect x="2" y="8" width="12" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <circle cx="4.5" cy="4" r="0.75" fill="currentColor"/>
      <circle cx="4.5" cy="10" r="0.75" fill="currentColor"/>
    </g>
    <g id="stream-flow-icon-hard-drive">
      <line x1="14" x2="14" y1="8" y2="8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <line x1="11" x2="11" y1="8" y2="8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <rect width="13" height="10" x="1.5" y="3" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
    </g>
  </defs>

  <rect width="960" height="420" fill="var(--bg-canvas, #090d16)"/>
  <rect width="960" height="420" fill="url(#stream-flow-grid)"/>

  <g id="boundaries">
    <rect x="24" y="24" width="912" height="372" rx="10" fill="none" stroke="var(--c-boundary, rgba(148, 163, 184, 0.22))" stroke-width="1.25" stroke-dasharray="6 4"/>
    <text x="40" y="46" class="boundary-title">PROCESSING BOUNDARY</text>
    <rect x="40" y="68" width="188" height="304" rx="8" fill="rgba(56, 189, 248, 0.03)" stroke="var(--c-client, #38bdf8)" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="56" y="90" class="region-title" fill="var(--c-client, #38bdf8)">INPUT</text>
    <rect x="328" y="68" width="296" height="304" rx="8" fill="rgba(16, 185, 129, 0.03)" stroke="var(--c-service, #10b981)" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="344" y="90" class="region-title" fill="var(--c-service, #10b981)">TRANSFORMATION</text>
    <rect x="724" y="68" width="204" height="304" rx="8" fill="rgba(245, 158, 11, 0.03)" stroke="var(--c-storage, #f59e0b)" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="740" y="90" class="region-title" fill="var(--c-storage, #f59e0b)">OUTPUTS</text>
  </g>

  <g id="connections-bent">
    <g id="flow-processor-sink-b" data-flow="processor-sink-b">
      <path id="connection-processor-sink-b" data-from="node-processor" data-to="node-sink-b" d="M 608 222 L 646 222 L 666 242 L 666 300 L 686 320 L 744 320" fill="none" stroke="var(--c-message, #8b5cf6)" stroke-width="1.5" marker-end="url(#stream-flow-arrow-message)"/>
    </g>
  </g>

  <g id="connections-straight">
    <g id="flow-source-processor" data-flow="source-processor">
      <path id="connection-source-processor" data-from="node-source" data-to="node-processor" d="M 212 188 L 344 188" fill="none" stroke="var(--c-message, #8b5cf6)" stroke-width="1.5" marker-end="url(#stream-flow-arrow-message)"/>
    </g>
    <g id="flow-processor-sink-a" data-flow="processor-sink-a">
      <path id="connection-processor-sink-a" data-from="node-processor" data-to="node-sink-a" d="M 608 188 L 744 188" fill="none" stroke="var(--c-message, #8b5cf6)" stroke-width="1.5" marker-end="url(#stream-flow-arrow-message)"/>
    </g>
  </g>

  <g id="connection-labels">
    <text x="278" y="174" class="line-label" text-anchor="middle" data-label-for="connection-source-processor">Input stream</text>
    <text x="676" y="174" class="line-label" text-anchor="middle" data-label-for="connection-processor-sink-a">Output A</text>
    <text x="705" y="306" class="line-label" text-anchor="middle" data-label-for="connection-processor-sink-b">Output B</text>
  </g>

  <g id="nodes">
    <g id="node-source" data-node="" transform="translate(48 156)">
      <rect data-node-box="" width="164" height="64" rx="6" fill="var(--node-base, #0b1329)"/>
      <rect width="164" height="64" rx="6" fill="rgba(56, 189, 248, 0.08)" stroke="var(--c-client, #38bdf8)" stroke-width="1.25"/>
      <g transform="translate(28 24)" color="var(--c-client, #38bdf8)"><use href="#stream-flow-icon-layers"/></g>
      <text x="54" y="29" class="node-title" data-node-title="">Source Node</text>
      <text x="54" y="47" class="node-subtitle">Event producer</text>
    </g>

    <g id="node-processor" data-node="" transform="translate(344 126)">
      <rect data-node-box="" width="264" height="140" rx="6" fill="var(--node-base, #0b1329)"/>
      <rect width="264" height="140" rx="6" fill="rgba(16, 185, 129, 0.08)" stroke="var(--c-service, #10b981)" stroke-width="1.5"/>
      <g transform="translate(49 22)" color="var(--c-service, #10b981)"><use href="#stream-flow-icon-server"/></g>
      <text x="75" y="31" class="node-title" data-node-title="">Processing Component</text>
      <text x="75" y="49" class="node-subtitle">Stateful transformation</text>
      <g data-partition="stage-a">
        <rect data-partition-box="" x="20" y="76" width="104" height="40" rx="3" fill="rgba(16, 185, 129, 0.15)"/>
        <text x="72" y="99" class="node-tag" text-anchor="middle" fill="var(--c-service, #10b981)">TRANSFORM</text>
      </g>
      <g data-partition="stage-b">
        <rect data-partition-box="" x="140" y="76" width="104" height="40" rx="3" fill="rgba(16, 185, 129, 0.15)"/>
        <text x="192" y="99" class="node-tag" text-anchor="middle" fill="var(--c-service, #10b981)">AGGREGATE</text>
      </g>
    </g>

    <g id="node-sink-a" data-node="" transform="translate(744 156)">
      <rect data-node-box="" width="168" height="64" rx="6" fill="var(--node-base, #0b1329)"/>
      <rect width="168" height="64" rx="6" fill="rgba(245, 158, 11, 0.08)" stroke="var(--c-storage, #f59e0b)" stroke-width="1.25"/>
      <g transform="translate(22 24)" color="var(--c-storage, #f59e0b)"><use href="#stream-flow-icon-hard-drive"/></g>
      <text x="48" y="29" class="node-title" data-node-title="">Output Node A</text>
      <text x="48" y="47" class="node-subtitle">Primary consumer</text>
    </g>

    <g id="node-sink-b" data-node="" transform="translate(744 288)">
      <rect data-node-box="" width="168" height="64" rx="6" fill="var(--node-base, #0b1329)"/>
      <rect width="168" height="64" rx="6" fill="rgba(245, 158, 11, 0.08)" stroke="var(--c-storage, #f59e0b)" stroke-width="1.25"/>
      <g transform="translate(18 24)" color="var(--c-storage, #f59e0b)"><use href="#stream-flow-icon-hard-drive"/></g>
      <text x="44" y="29" class="node-title" data-node-title="">Output Node B</text>
      <text x="44" y="47" class="node-subtitle">Secondary consumer</text>
    </g>
  </g>
</svg>
