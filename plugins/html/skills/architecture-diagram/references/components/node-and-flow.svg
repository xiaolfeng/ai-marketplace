<svg xmlns="http://www.w3.org/2000/svg" class="architecture-component" viewBox="0 0 960 360" data-export-viewbox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="node-and-flow-title node-and-flow-desc">
  <title id="node-and-flow-title">节点与同步调用</title>
  <desc id="node-and-flow-desc">外部调用方请求主组件，主组件包含两个职责分区并读写持久化存储。</desc>
  <defs>
    <style>
      /* Default values match example.html; inherited page tokens take precedence. */
      .architecture-component { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .architecture-component[data-theme="light"] {
        --bg-canvas: #f8fafc;
        --node-base: #ffffff;
        --grid-line: rgba(100, 116, 139, 0.08);
        --grid-dot: rgba(100, 116, 139, 0.22);
        --c-client: #0284c7;
        --c-gateway: #0369a1;
        --c-service: #059669;
        --c-storage: #d97706;
        --c-security: #e11d48;
        --c-message: #7c3aed;
        --c-boundary: rgba(100, 116, 139, 0.35);
        --c-boundary-text: #334155;
        --node-title-fill: #0f172a;
        --node-sub-fill: #475569;
        --line-label-fill: #475569;
      }
      .architecture-component .node-title { fill: var(--node-title-fill, #f8fafc); font-size: 11.5px; font-weight: 600; }
      .architecture-component .node-subtitle { fill: var(--node-sub-fill, #94a3b8); font-family: "JetBrains Mono", monospace; font-size: 9px; font-weight: 400; }
      .architecture-component .node-tag { font-family: "JetBrains Mono", monospace; font-size: 8px; font-weight: 600; }
      .architecture-component .line-label { fill: var(--line-label-fill, #94a3b8); font-family: "JetBrains Mono", monospace; font-size: 8.5px; font-weight: 600; }
      .architecture-component .boundary-title { fill: var(--c-boundary-text, #94a3b8); font-family: "JetBrains Mono", monospace; font-size: 10px; font-weight: 600; }
      .architecture-component .region-title { font-family: "JetBrains Mono", monospace; font-size: 9px; font-weight: 600; }
    </style>
    <pattern id="node-and-flow-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="var(--grid-line, rgba(148, 163, 184, 0.05))" stroke-width="0.75"/>
      <circle cx="0" cy="0" r="0.8" fill="var(--grid-dot, rgba(148, 163, 184, 0.18))"/>
    </pattern>
    <marker id="node-and-flow-arrow-client" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.5, 7 3, 0 5.5" fill="var(--c-client, #38bdf8)"/>
    </marker>
    <marker id="node-and-flow-arrow-storage" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.5, 7 3, 0 5.5" fill="var(--c-storage, #f59e0b)"/>
    </marker>
    <g id="node-and-flow-icon-layers">
      <path d="M2 5.5 8 2l6 3.5-6 3.5-6-3.5Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M2 9.5 8 13l6-3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
    <g id="node-and-flow-icon-server">
      <rect x="2" y="2" width="12" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <rect x="2" y="8" width="12" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <circle cx="4.5" cy="4" r="0.75" fill="currentColor"/>
      <circle cx="4.5" cy="10" r="0.75" fill="currentColor"/>
    </g>
    <g id="node-and-flow-icon-database">
      <ellipse cx="8" cy="4" rx="6" ry="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <path d="M2 4v4c0 1.1 2.7 2 6 2s6-.9 6-2V4M2 8v4c0 1.1 2.7 2 6 2s6-.9 6-2V8" fill="none" stroke="currentColor" stroke-width="1.5"/>
    </g>
  </defs>

  <rect width="960" height="360" fill="var(--bg-canvas, #090d16)"/>
  <rect width="960" height="360" fill="url(#node-and-flow-grid)"/>

  <g id="boundaries">
    <rect x="308" y="24" width="636" height="312" rx="10" fill="none" stroke="var(--c-boundary, rgba(148, 163, 184, 0.22))" stroke-width="1.25" stroke-dasharray="6 4"/>
    <text x="324" y="46" class="boundary-title">DEPLOYMENT BOUNDARY</text>
    <rect x="320" y="68" width="288" height="244" rx="8" fill="rgba(16, 185, 129, 0.03)" stroke="var(--c-service, #10b981)" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="336" y="90" class="region-title" fill="var(--c-service, #10b981)">APPLICATION</text>
    <rect x="712" y="68" width="220" height="244" rx="8" fill="rgba(245, 158, 11, 0.03)" stroke="var(--c-storage, #f59e0b)" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="728" y="90" class="region-title" fill="var(--c-storage, #f59e0b)">PERSISTENCE</text>
  </g>

  <g id="connections-bent"></g>

  <g id="connections-straight">
    <g id="flow-client-main" data-flow="client-main">
      <path id="connection-client-main" data-from="node-client" data-to="node-primary" d="M 200 200 L 332 200" fill="none" stroke="var(--c-client, #38bdf8)" stroke-width="1.5" marker-end="url(#node-and-flow-arrow-client)"/>
    </g>
    <g id="flow-main-store" data-flow="main-store">
      <path id="connection-main-store" data-from="node-primary" data-to="node-store" d="M 596 200 L 732 200" fill="none" stroke="var(--c-storage, #f59e0b)" stroke-width="1.5" marker-end="url(#node-and-flow-arrow-storage)"/>
    </g>
  </g>

  <g id="connection-labels">
    <text x="266" y="186" class="line-label" text-anchor="middle" data-label-for="connection-client-main">Request</text>
    <text x="664" y="186" class="line-label" text-anchor="middle" data-label-for="connection-main-store">Read / Write</text>
  </g>

  <g id="nodes">
    <g id="node-client" data-node="" transform="translate(40 168)">
      <rect data-node-box="" width="160" height="64" rx="6" fill="var(--node-base, #0b1329)"/>
      <rect width="160" height="64" rx="6" fill="rgba(56, 189, 248, 0.08)" stroke="var(--c-client, #38bdf8)" stroke-width="1.25"/>
      <g transform="translate(22 24)" color="var(--c-client, #38bdf8)"><use href="#node-and-flow-icon-layers"/></g>
      <text x="48" y="29" class="node-title" data-node-title="">Client Node</text>
      <text x="48" y="47" class="node-subtitle">External caller</text>
    </g>

    <g id="node-primary" data-node="" transform="translate(332 130)">
      <rect data-node-box="" width="264" height="140" rx="6" fill="var(--node-base, #0b1329)"/>
      <rect width="264" height="140" rx="6" fill="rgba(16, 185, 129, 0.08)" stroke="var(--c-service, #10b981)" stroke-width="1.5"/>
      <g transform="translate(51 22)" color="var(--c-service, #10b981)"><use href="#node-and-flow-icon-server"/></g>
      <text x="77" y="31" class="node-title" data-node-title="">Primary Component</text>
      <text x="77" y="49" class="node-subtitle">Multiple responsibilities</text>
      <g data-partition="capability-a">
        <rect data-partition-box="" x="20" y="76" width="104" height="40" rx="3" fill="rgba(16, 185, 129, 0.15)"/>
        <text x="72" y="99" class="node-tag" text-anchor="middle" fill="var(--c-service, #10b981)">UNIT A · ROLE A</text>
      </g>
      <g data-partition="capability-b">
        <rect data-partition-box="" x="140" y="76" width="104" height="40" rx="3" fill="rgba(16, 185, 129, 0.15)"/>
        <text x="192" y="99" class="node-tag" text-anchor="middle" fill="var(--c-service, #10b981)">UNIT B · ROLE B</text>
      </g>
    </g>

    <g id="node-store" data-node="" transform="translate(732 168)">
      <rect data-node-box="" width="188" height="64" rx="6" fill="var(--node-base, #0b1329)"/>
      <rect width="188" height="64" rx="6" fill="rgba(245, 158, 11, 0.08)" stroke="var(--c-storage, #f59e0b)" stroke-width="1.25"/>
      <g transform="translate(32 24)" color="var(--c-storage, #f59e0b)"><use href="#node-and-flow-icon-database"/></g>
      <text x="58" y="29" class="node-title" data-node-title="">Storage Node</text>
      <text x="58" y="47" class="node-subtitle">Persistent state</text>
    </g>
  </g>
</svg>
