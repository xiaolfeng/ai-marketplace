<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400">
  <defs>
    <style>
      .title { fill: #f8fafc; font: 600 12px Inter, sans-serif; }
      .sub { fill: #94a3b8; font: 9px "JetBrains Mono", monospace; }
      .line-label { fill: #94a3b8; font: 600 9px "JetBrains Mono", monospace; }
    </style>
    <marker id="arrow-sync" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.5,7 3,0 5.5" fill="#10b981"/>
    </marker>
    <marker id="arrow-async" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0.5,7 3,0 5.5" fill="#8b5cf6"/>
    </marker>
    <g id="icon-server">
      <rect x="2" y="2" width="12" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <rect x="2" y="8" width="12" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <circle cx="4.5" cy="4" r="0.75" fill="currentColor"/>
      <circle cx="4.5" cy="10" r="0.75" fill="currentColor"/>
    </g>
  </defs>

  <rect width="720" height="400" fill="#090d16"/>

  <g id="boundaries">
    <rect x="24" y="24" width="672" height="352" rx="10" fill="none" stroke="#475569" stroke-dasharray="6 4"/>
    <text x="40" y="48" class="sub">SHARED DEPLOYMENT BOUNDARY</text>
  </g>

  <g id="connections-bent">
    <g id="flow-gateway-worker" data-flow="gateway-worker">
      <path id="connection-gateway-worker" data-from="node-gateway" data-to="node-worker" d="M 184 188 L 208 188 L 224 286 L 268 286" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-async)"/>
    </g>
  </g>

  <g id="connections-straight">
    <g id="flow-gateway-primary" data-flow="gateway-primary">
      <path id="connection-gateway-primary" data-from="node-gateway" data-to="node-primary" d="M 184 156 L 268 156" fill="none" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
    </g>
    <g id="flow-primary-dependent" data-flow="primary-dependent">
      <path id="connection-primary-dependent" data-from="node-primary" data-to="node-dependent" d="M 444 156 L 520 156" fill="none" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-sync)"/>
    </g>
  </g>

  <g id="connection-labels">
    <text x="226" y="140" text-anchor="middle" class="line-label" data-label-for="connection-gateway-primary">Synchronous</text>
    <text x="218" y="264" text-anchor="middle" class="line-label" data-label-for="connection-gateway-worker">Asynchronous</text>
    <text x="482" y="140" text-anchor="middle" class="line-label" data-label-for="connection-primary-dependent">Dependency</text>
  </g>

  <g id="nodes">
    <g id="node-gateway" data-node transform="translate(40 124)">
      <rect data-node-box width="144" height="64" rx="6" fill="#0b1329" stroke="#38bdf8"/>
      <g transform="translate(18 24)" color="#38bdf8"><use href="#icon-server"/></g>
      <text x="44" y="29" class="title">Gateway Node</text>
      <text x="44" y="47" class="sub">Entry point</text>
    </g>

    <g id="node-primary" data-node transform="translate(268 124)">
      <rect data-node-box width="176" height="64" rx="6" fill="#0b1329" stroke="#10b981"/>
      <g transform="translate(22 24)" color="#10b981"><use href="#icon-server"/></g>
      <text x="48" y="29" class="title">Primary Service</text>
      <text x="48" y="47" class="sub">Synchronous processing</text>
    </g>

    <g id="node-worker" data-node transform="translate(268 254)">
      <rect data-node-box width="176" height="64" rx="6" fill="#0b1329" stroke="#8b5cf6"/>
      <g transform="translate(22 24)" color="#8b5cf6"><use href="#icon-server"/></g>
      <text x="48" y="29" class="title">Worker Node</text>
      <text x="48" y="47" class="sub">Asynchronous processing</text>
    </g>

    <g id="node-dependent" data-node transform="translate(520 124)">
      <rect data-node-box width="160" height="64" rx="6" fill="#0b1329" stroke="#f59e0b"/>
      <g transform="translate(18 24)" color="#f59e0b"><use href="#icon-server"/></g>
      <text x="44" y="29" class="title">Dependent Node</text>
      <text x="44" y="47" class="sub">Downstream service</text>
    </g>
  </g>
</svg>
