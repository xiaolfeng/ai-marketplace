<!-- 模块：底部步进栏 (Dock) -->
<!-- 适用场景：页面骨架，全页唯一：浮动在底部的「上一步 / 步骤圆点 / 下一步」控制条，600px 以下按钮文字自动收起 -->
<nav class="dock" aria-label="步进控制">
  <div class="dock-inner">
    <button class="step-btn prev" id="btn-prev" type="button">
      ← <span class="long">上一步</span>
    </button>
    <div class="dots" id="dots"></div>
    <button class="step-btn next" id="btn-next" type="button">
      <span class="long">下一步</span> →
    </button>
  </div>
</nav>
