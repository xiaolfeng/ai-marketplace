<!-- 模块：行动按钮 (CTA) -->
<!-- 适用场景：主行动按钮（实心强调）与幽灵按钮（描边次要），以及终点页的行动按钮排；data-go 跳画面、data-act 触发导出 / 打印 / 回开头 -->
<button class="cta" type="button" data-go="1">从第 1 步开始 →</button>
<button class="cta ghost" type="button" data-go="0">回到开头</button>

<div class="row-actions no-print">
  <button class="cta ghost" type="button" data-go="0">回到开头</button>
  <button class="cta ghost" type="button" data-act="md">导出 Markdown</button>
  <button class="cta ghost" type="button" data-act="print">
    打印 / 存为 PDF
  </button>
</div>
