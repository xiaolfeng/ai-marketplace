<!-- 模块：单屏画面骨架 (Screen) -->
<!-- 适用场景：每屏（开场 / 步骤 / 终点）的外壳：眉题 kicker + 衬线大标题 + 一句话 lead；标题可加 span.mark 荧光笔高亮 -->
<article class="screen">
  <div class="kicker">
    <span class="num">第 3 步 / 共 8 步</span>
    <span>阶段二：实测与暴露真问题</span>
    <!-- 状态标签可选：decision=关键拍板，blocked=卡住了 -->
    <span class="tag decision">关键拍板</span>
  </div>
  <h2 class="title">跑通压测，<span class="mark">揪出空窗</span></h2>
  <p class="lead">一句话说清这一步让你明白了什么。</p>
  <!-- 开场画面用 h1.title；其后可接 meta-strip 元信息条与各内容区块 -->
</article>
