<!-- 模块：顶栏 (Topbar) -->
<!-- 适用场景：页面骨架，全页唯一：目录按钮、标题、进度计数、主题切换、更多菜单与 3px 进度条。id 均为脚本挂载点，不要改名 -->
<header class="topbar">
  <div class="topbar-inner">
    <button
      class="icon-btn"
      id="btn-toc"
      type="button"
      aria-label="打开目录"
      title="目录（T）"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
      >
        <path d="M4 6h16M4 12h16M4 18h10" />
      </svg>
    </button>
    <div class="bar-title" id="bar-title"></div>
    <span class="bar-count" id="bar-count"></span>
    <button
      class="icon-btn"
      id="btn-theme"
      type="button"
      aria-label="切换深浅色"
      title="切换深浅色"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
      >
        <circle cx="12" cy="12" r="8" />
        <path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" />
      </svg>
    </button>
    <div class="menu-wrap">
      <button
        class="icon-btn"
        id="btn-menu"
        type="button"
        aria-label="更多"
        aria-haspopup="true"
        aria-expanded="false"
      >
        <svg viewBox="0 0 24 24" fill="currentColor">
          <circle cx="5" cy="12" r="1.7" />
          <circle cx="12" cy="12" r="1.7" />
          <circle cx="19" cy="12" r="1.7" />
        </svg>
      </button>
      <div class="menu" id="menu" role="menu">
        <button type="button" role="menuitem" data-act="md">
          导出 Markdown
        </button>
        <button type="button" role="menuitem" data-act="print">
          打印 / 存为 PDF
        </button>
        <button type="button" role="menuitem" data-act="restart">
          回到开头
        </button>
      </div>
    </div>
  </div>
  <div class="progress"><span id="progress-bar"></span></div>
</header>
