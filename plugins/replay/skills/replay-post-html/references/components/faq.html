<dl class="faq" data-component="faq">
  <dt>为什么进程排空验证通过，还是出现了 502？</dt>
  <dd>
    <div class="short">排空只覆盖已建立的请求，502 空窗来自部署策略。</div>
    <!-- 深层解释可省略 -->
    <div class="deep">
      单副本 Recreate
      先停止旧实例再启动新实例，替换期间负载均衡没有可用后端，这段空窗无法通过应用代码消除，需要
      RollingUpdate 或多副本承接。
    </div>
  </dd>
</dl>
