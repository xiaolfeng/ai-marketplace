<!-- 模块：末页操作排 (Row Actions) · 适用场景：末页底部收尾动作：回到封面 / 导出 Markdown / 打印存为 PDF -->
<div class="row-actions" data-component="row-actions">
  <!-- data-go="0" 回封面；data-act 与顶栏菜单共用：md 导出 Markdown、print 打印 / 存为 PDF -->
  <button class="cta ghost" type="button" data-go="0">回到封面</button>
  <button class="cta ghost" type="button" data-act="md">导出 Markdown</button>
  <button class="cta ghost" type="button" data-act="print">
    打印 / 存为 PDF
  </button>
</div>
